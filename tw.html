function renderTreemap() {
  const container = document.getElementById('treemapContainer');
  const CW = container.clientWidth  || 1460;
  const CH = container.clientHeight || 660;

  // Period-specific changes
  const pChanges = getHistoryChanges(tmPeriod);
  const periodLabel = tmPeriod==='week'?'當周':tmPeriod==='month'?'當月':'當日';
  const noHist = tmPeriod !== 'day' && !pChanges;

  const stats = computeSectorStats();
  // Override changePct for week/month
  if (pChanges) {
    for (const sec of stats) {
      sec.stocks.forEach(st => {
        if (pChanges[st.code] != null) st._pct = pChanges[st.code]; else st._pct = st.changePct;
      });
      sec.avgChange = sec.stocks.reduce((s,st)=>s+(st._pct??st.changePct),0)/sec.stocks.length;
    }
    stats.sort((a,b)=>b.avgChange-a.avgChange);
  } else {
    for (const sec of stats) sec.stocks.forEach(st => { st._pct = st.changePct; });
  }

  // Build HTML
  const sectorRects = treemapLayout(stats.map(s=>({...s, value:s.totalValue||1})), 0, 0, CW, CH);
  let html = '';
  const LABEL_H = 18, GAP = 1.5;

  if (noHist) {
    html = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:8px;color:#6688aa;font-size:13px;">
      <div style="font-size:28px;">📊</div>
      <div>${periodLabel}資料尚不足</div>
      <div style="font-size:11px;color:#4a5a7a;">需每日開啟頁面累積歷史收盤價（${tmPeriod==='week'?'≥5':'≥22'}筆）</div>
    </div>`;
  } else {
    for (const sr of sectorRects) {
      const sx=sr.x+GAP, sy=sr.y+GAP, sw=sr.w-GAP*2, sh=sr.h-GAP*2;
      if (sw<4||sh<4) continue;
      const sChg=sr.avgChange, sClr=sChg>=0?'#ff6680':'#6699ff';

      html+=`<div style="position:absolute;left:${sx.toFixed(1)}px;top:${sy.toFixed(1)}px;
        width:${sw.toFixed(1)}px;height:${sh.toFixed(1)}px;overflow:hidden;border-radius:3px;
        border:1px solid rgba(255,255,255,.08);box-sizing:border-box;">`;

      html+=`<div onclick="sectorMapJump('${sr.cat}')" style="height:${LABEL_H}px;line-height:${LABEL_H}px;
        background:rgba(0,0,0,.7);padding:0 5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
        border-bottom:1px solid rgba(255,255,255,.06);overflow:hidden;white-space:nowrap;"
        onmouseover="this.style.background='rgba(68,136,255,.15)'" onmouseout="this.style.background='rgba(0,0,0,.7)'">
        <span style="font-size:10px;font-weight:700;color:#c8c8ee;">${sr.label}</span>
        <span style="font-size:10px;font-weight:700;color:${sClr};">${sChg>0?'+':''}${sChg.toFixed(2)}%</span>
      </div>`;

      const iW=sw-2, iH=sh-LABEL_H-2;
      if (iW>2&&iH>2) {
        const stockRects=treemapLayout(sr.stocks.map(st=>({...st,value:Math.max(st.valueYi||0,.05)})),0,0,iW,iH);
        html+=`<div style="position:relative;width:${iW.toFixed(1)}px;height:${iH.toFixed(1)}px;margin:1px;">`;
        for (const st of stockRects) {
          const chg=st._pct??st.changePct;
          const bg=stockHeatBg(chg);
          const tw2=st.w-1,th2=st.h-1;
          if(tw2<2||th2<2) continue;
          const area=tw2*th2;
          const showCode=area>600&&tw2>28&&th2>16;
          const showPct=area>1000&&tw2>32&&th2>24;
          const showName=area>2200&&tw2>50&&th2>34;
          const big=area>6000;
          const pC=chg>=0?'#ffcccc':'#bbccff';
          const pS=chg>0?'+':'';
          const pT=`${pS}${chg.toFixed(area>5000?2:1)}%`;

          html+=`<div onclick="closeSectorModal();openModal(allStocks.find(x=>x.code==='${st.code}'))"
            style="position:absolute;left:${st.x.toFixed(1)}px;top:${st.y.toFixed(1)}px;
            width:${tw2.toFixed(1)}px;height:${th2.toFixed(1)}px;
            background:${bg};cursor:pointer;overflow:hidden;box-sizing:border-box;
            border:.5px solid rgba(0,0,0,.4);display:flex;flex-direction:column;
            align-items:center;justify-content:center;padding:1px 2px;
            transition:filter .12s;"
            onmouseover="this.style.filter='brightness(1.4) contrast(1.1)';this.style.zIndex=100;
              this.title='${st.code} ${st.name}  ${periodLabel} ${pT}  ${fmtYi(st.valueYi||0)}'"
            onmouseout="this.style.filter='';this.style.zIndex=''">`;
          if(showCode) html+=`<div style="font-size:${big?10:8}px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.2;">${st.code}</div>`;
          if(showName) html+=`<div style="font-size:${big?9:7}px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.1;">${st.name}</div>`;
          if(showPct)  html+=`<div style="font-size:${big?12:9}px;font-weight:900;color:${pC};line-height:1.2;">${pT}</div>`;
          html+='</div>';
        }
        html+='</div>';
      }
      html+='</div>';
    }
  }

  container.innerHTML = `<div id="treemapInner" style="width:${CW}px;height:${CH}px;position:relative;transform-origin:0 0;will-change:transform;">${html}</div>`;
  applyTmTransform();
}

// ── Zoom & Pan ────────────────────────────────────────────────────
function applyTmTransform() {
  const inner = document.getElementById('treemapInner');
  if (!inner) return;
  inner.style.transform = `translate(${tmPanX.toFixed(1)}px,${tmPanY.toFixed(1)}px) scale(${tmZoom.toFixed(3)})`;
  const badge = document.getElementById('tmZoomBadge');
  if (badge) badge.textContent = tmZoom.toFixed(1) + 'x';
}

function resetTreemapZoom() {
  tmZoom=1; tmPanX=0; tmPanY=0;
  applyTmTransform();
}

function setupTreemapZoom() {
  const ctn = document.getElementById('treemapContainer');
  if (!ctn) return;

  ctn.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.2 : -0.2;
    const newZ  = Math.max(1, Math.min(8, tmZoom + delta * tmZoom * 0.5));
    const rect  = ctn.getBoundingClientRect();
    const cx    = e.clientX - rect.left;
    const cy    = e.clientY - rect.top;
    // Zoom toward cursor
    const ratio = newZ / tmZoom;
    tmPanX = cx - ratio * (cx - tmPanX);
    tmPanY = cy - ratio * (cy - tmPanY);
    tmZoom = newZ;
    if (tmZoom <= 1.01) { tmZoom=1; tmPanX=0; tmPanY=0; }
    applyTmTransform();
  }, { passive: false });

  ctn.addEventListener('mousedown', e => {
    if (tmZoom <= 1.01) return;
    tmDragging = true;
    tmDragX = e.clientX; tmDragY = e.clientY;
    ctn.style.cursor = 'grabbing';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!tmDragging) return;
    tmPanX += e.clientX - tmDragX;
    tmPanY += e.clientY - tmDragY;
    tmDragX = e.clientX; tmDragY = e.clientY;
    applyTmTransform();
  });
  document.addEventListener('mouseup', () => {
    if (!tmDragging) return;
    tmDragging = false;
    const ctn2 = document.getElementById('treemapContainer');
    if (ctn2) ctn2.style.cursor = tmZoom > 1.01 ? 'grab' : '';
  });

  // Touch support
  let lastTouchDist = 0;
  ctn.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      lastTouchDist = Math.hypot(e.touches[1].clientX-e.touches[0].clientX, e.touches[1].clientY-e.touches[0].clientY);
    } else if (e.touches.length === 1 && tmZoom > 1.01) {
      tmDragging = true;
      tmDragX = e.touches[0].clientX; tmDragY = e.touches[0].clientY;
    }
  }, { passive: true });
  ctn.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[1].clientX-e.touches[0].clientX, e.touches[1].clientY-e.touches[0].clientY);
      if (lastTouchDist > 0) {
        const ratio = d / lastTouchDist;
        tmZoom = Math.max(1, Math.min(8, tmZoom * ratio));
        if (tmZoom <= 1.01) { tmZoom=1; tmPanX=0; tmPanY=0; }
        applyTmTransform();
      }
      lastTouchDist = d;
      e.preventDefault();
    } else if (tmDragging && e.touches.length === 1) {
      tmPanX += e.touches[0].clientX - tmDragX;
      tmPanY += e.touches[0].clientY - tmDragY;
      tmDragX = e.touches[0].clientX; tmDragY = e.touches[0].clientY;
      applyTmTransform();
      e.preventDefault();
    }
  }, { passive: false });
  ctn.addEventListener('touchend', () => { tmDragging=false; lastTouchDist=0; });
}

function closeSectorModal() {
  document.getElementById('sectorModal').style.display = 'none';
  document.body.style.overflow = '';
}

function sectorMapJump(cat) {
  closeSectorModal();
  const btn = document.querySelector(`#catFilters .cat-pill[onclick*="'${cat}'"]`);
  if (btn) setCategory(cat, btn);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeSectorModal(); closeDailyFocus(); }
});

loadAll().then(startCountdown);
</script>
