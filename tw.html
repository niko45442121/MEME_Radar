<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股雷達 | 妖股偵測器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg-deep: #05050f;
  --bg-card: #0d0d1f;
  --bg-hover: #141428;
  --accent-green: #00ff88;
  --accent-gold: #f7c948;
  --accent-red: #ff4466;
  --accent-blue: #4488ff;
  --accent-purple: #aa44ff;
  --text-primary: #e8e8ff;
  --text-secondary: #8888aa;
  --border: #1e1e3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-deep); color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
::-webkit-scrollbar { width: 4px; height: 4px; }
#catFilters::-webkit-scrollbar { display: none; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

@keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:.3} }
@keyframes fadeIn   { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
@keyframes glow     { 0%,100%{box-shadow:0 0 4px rgba(255,34,68,.4)} 50%{box-shadow:0 0 10px rgba(255,34,68,.9)} }
@keyframes spin     { to{transform:rotate(360deg)} }

.pulse   { animation: pulse 2s ease-in-out infinite; }
.fade-in { animation: fadeIn .2s ease; }
.glow    { animation: glow 1.5s ease-in-out infinite; }
.spin    { animation: spin .8s linear infinite; }

.info-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:16px; }
.cat-pill {
  padding:4px 12px; border-radius:20px; font-size:12px; cursor:pointer;
  transition:all .15s; white-space:nowrap; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text-secondary);
}
.cat-pill.active { background:rgba(0,255,136,.12); color:var(--accent-green); border-color:rgba(0,255,136,.4); }
.cat-pill:not(.active):hover { color:var(--text-primary); border-color:rgba(255,255,255,.2); }
.stock-row { transition:background .15s; cursor:pointer; border-bottom:1px solid var(--border); }
.stock-row:hover { background:var(--bg-hover); }
.badge {
  display:inline-flex; align-items:center; padding:2px 7px;
  border-radius:4px; font-size:10px; font-weight:600; white-space:nowrap; margin-right:3px;
}
.score-circle { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; }
.sidebar-item { display:flex; align-items:center; justify-content:space-between; padding:7px 8px; border-radius:8px; margin-bottom:2px; transition:background .15s; cursor:pointer; }
.sidebar-item:hover { background:var(--bg-hover); }
th { font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-secondary); padding:10px 8px; cursor:pointer; white-space:nowrap; border-bottom:1px solid var(--border); user-select:none; }
th:hover { color:var(--text-primary); }
td { padding:9px 8px; }
.sort-arr { opacity:.4; font-size:10px; }
.sort-arr.active { opacity:1; color:var(--accent-green); }
.breadth-bar { height:8px; border-radius:4px; overflow:hidden; display:flex; margin:6px 0; }
.index-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; }

/* Modals */
#stockModal, #sectorModal {
  display:none; position:fixed; inset:0; z-index:1000;
  background:rgba(0,0,0,.92); backdrop-filter:blur(8px);
  overflow-y:auto; padding:12px;
}
.heat-tile { transition:transform .15s, box-shadow .15s; cursor:pointer; }
.heat-tile:hover { transform:scale(1.04); box-shadow:0 4px 20px rgba(0,0,0,.5); }
.modal-box {
  max-width:1500px; margin:0 auto;
  background:#06061a; border:1px solid #1a1a38;
  border-radius:12px; overflow:hidden;
}
.analysis-card {
  background:rgba(0,0,0,.4); border:1px solid #1a1a38;
  border-radius:8px; padding:10px 12px;
}
.analysis-card h4 { font-size:11px; font-weight:700; margin:0 0 7px; color:#6666aa; letter-spacing:.07em; text-transform:uppercase; }
.stat-row { display:flex; justify-content:space-between; align-items:center; padding:2.5px 0; font-size:11.5px; border-bottom:1px solid rgba(255,255,255,.03); }
.stat-row:last-child { border-bottom:none; }
.stat-label { color:#6688aa; }
.dash-hdr-val { display:flex; flex-direction:column; }
.dash-hdr-val .v-main { font-size:22px; font-weight:900; line-height:1.1; }
.dash-hdr-val .v-sub  { font-size:11px; font-weight:600; margin-top:2px; }
.dash-hdr-sep { width:1px; height:36px; background:#1a1a38; }
.dash-info-block { font-size:11px; color:#6688aa; line-height:1.9; }
.dash-info-block span { color:#c8c8ee; font-weight:600; }
.signal-light { width:44px; height:44px; border-radius:50%; margin:0 auto 6px; border:2px solid; }
.panel-title { font-size:10px; color:#6688aa; letter-spacing:.07em; margin-bottom:8px; font-weight:700; text-transform:uppercase; }
.op-badge { display:inline-block; padding:4px 14px; border-radius:6px; font-size:13px; font-weight:800; margin-bottom:8px; }
.tech-row { display:grid; grid-template-columns:80px 1fr; align-items:center; padding:3px 0; font-size:11px; border-bottom:1px solid rgba(255,255,255,.03); gap:6px; }
.tech-row:last-child { border-bottom:none; }
.tech-row .tr-k { color:#6688aa; }
.conclusion-banner { padding:10px 18px; border-top:2px solid #1a1a38; background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(10,10,30,.8)); text-align:center; font-size:12.5px; font-weight:700; letter-spacing:.05em; line-height:1.7; }
.pattern-badge { border-radius:6px; padding:5px 9px; margin-bottom:5px; }
.pattern-badge .p-name { font-size:11.5px; font-weight:700; margin-bottom:2px; }
.pattern-badge .p-desc { font-size:10px; color:#8899bb; line-height:1.4; }
</style>
</head>
<body>

<!-- Daily Focus Modal -->
<div id="dailyModal" onclick="if(event.target===this)closeDailyFocus()" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);overflow-y:auto;padding:12px;">
  <div style="max-width:1400px;margin:0 auto;background:#08081a;border:1px solid #1a1a38;border-radius:12px;overflow:hidden;" onclick="event.stopPropagation()">
    <div style="padding:10px 16px;border-bottom:1px solid #1a1a38;display:flex;align-items:center;justify-content:space-between;background:#060614;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:16px;font-weight:800;color:#e8e8ff;">📰 每日焦點</span>
        <span id="dailySubtitle" style="font-size:11px;color:#6688aa;"></span>
      </div>
      <button onclick="closeDailyFocus()" style="padding:5px 13px;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#8888aa;cursor:pointer;font-size:13px;">✕</button>
    </div>
    <div id="dailyContent" style="padding:14px 16px;"></div>
  </div>
</div>

<!-- Sector Heatmap Modal -->
<div id="sectorModal" onclick="if(event.target===this)closeSectorModal()">
  <div style="max-width:1500px;margin:0 auto;background:#08081a;border:1px solid #1a1a38;border-radius:12px;overflow:hidden;" onclick="event.stopPropagation()">
    <div style="padding:8px 16px;border-bottom:1px solid #1a1a38;display:flex;align-items:center;justify-content:space-between;background:#060614;flex-wrap:wrap;gap:8px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:16px;font-weight:800;color:#e8e8ff;">🗺️ 板塊輪動地圖</span>
        <span id="sectorSubtitle" style="font-size:11px;color:#6688aa;"></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div id="tmTabs" style="display:flex;gap:3px;background:rgba(255,255,255,.04);border-radius:6px;padding:2px;">
          <button class="tm-tab active" data-p="day" onclick="setTreemapPeriod('day')" style="padding:3px 12px;border-radius:4px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:rgba(0,255,136,.15);color:#00ff88;">當日</button>
          <button class="tm-tab" data-p="week" onclick="setTreemapPeriod('week')" style="padding:3px 12px;border-radius:4px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:#6688aa;">當周</button>
          <button class="tm-tab" data-p="month" onclick="setTreemapPeriod('month')" style="padding:3px 12px;border-radius:4px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:#6688aa;">當月</button>
        </div>
        <span id="tmZoomBadge" style="font-size:10px;color:#4a5a7a;min-width:36px;text-align:center;">1.0x</span>
        <button onclick="resetTreemapZoom()" style="padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#6688aa;font-size:10px;cursor:pointer;">⟲</button>
        <button onclick="closeSectorModal()" style="padding:5px 13px;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#8888aa;cursor:pointer;font-size:13px;">✕</button>
      </div>
    </div>
    <div style="padding:6px;">
      <div id="treemapContainer" style="position:relative;width:100%;height:660px;border-radius:6px;overflow:hidden;background:#0a0a18;cursor:grab;"></div>
    </div>
    <div id="treemapLegend" style="padding:6px 14px 10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:10px;color:#6688aa;"></div>
  </div>
</div>

<!-- Stock Detail Modal -->
<div id="stockModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">

    <!-- ── Header bar ── -->
    <div style="padding:10px 16px;border-bottom:1px solid #1a1a38;background:#080818;display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:8px;min-width:160px;">
        <span id="mName" style="font-size:18px;font-weight:900;color:#e8e8ff;"></span>
        <span id="mCode" style="font-size:12px;color:#6688aa;"></span>
        <span id="mCat" style="font-size:9px;padding:1px 7px;border-radius:3px;background:rgba(68,136,255,.15);color:#4488ff;border:1px solid rgba(68,136,255,.3);"></span>
      </div>
      <div id="mPriceArea" style="display:flex;align-items:center;gap:16px;flex:1;flex-wrap:wrap;"></div>
      <button onclick="closeModal()" style="padding:5px 13px;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#8888aa;cursor:pointer;font-size:13px;flex-shrink:0;">✕</button>
    </div>

    <!-- ── Loading ── -->
    <div id="mLoading" style="padding:60px;text-align:center;color:#6688aa;font-size:14px;">
      <div style="width:20px;height:20px;border:2px solid rgba(0,255,136,.3);border-top-color:#00ff88;border-radius:50%;display:inline-block;" class="spin"></div>
      <div style="margin-top:12px;">載入K線資料中...</div>
    </div>

    <!-- ── Error ── -->
    <div id="mError" style="display:none;padding:40px;text-align:center;color:#f7c948;font-size:13px;"></div>

    <!-- ── Content ── -->
    <div id="mContent" style="display:none;">

      <!-- Main 2-col grid: chart left | analysis right -->
      <div style="display:grid;grid-template-columns:3fr 2fr;">

        <!-- Left: K-line chart -->
        <div style="border-right:1px solid #1a1a38;padding:8px 10px;">
          <div style="font-size:10px;color:#5566aa;margin-bottom:4px;letter-spacing:.05em;">K線主圖（日線）－含布林通道 / MA5 / MA20 / MA60</div>
          <canvas id="mainChart" style="width:100%;display:block;"></canvas>
        </div>

        <!-- Right: analysis panels -->
        <div style="padding:8px 10px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:620px;">

          <!-- Row 1: signal light + win rate gauge -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;">

            <!-- 主力燈號 -->
            <div id="mSignalPanel" class="analysis-card" style="text-align:center;padding:10px 8px;"></div>

            <!-- 短線勝率 gauge -->
            <div id="mWinRate" class="analysis-card" style="text-align:center;padding:10px 8px;"></div>

          </div>

          <!-- 技術分析 -->
          <div id="mTechSummary" class="analysis-card"></div>

          <!-- 操作建議 -->
          <div id="mOperation" class="analysis-card"></div>

          <!-- 成交量分析 -->
          <div id="mChip" class="analysis-card"></div>

        </div>
      </div>

      <!-- Bottom 2-col: 型態分析 | 技術分析總覽 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #1a1a38;">
        <div id="mPatterns" style="padding:10px 14px;border-right:1px solid #1a1a38;"></div>
        <div id="mTechOverview" style="padding:10px 14px;"></div>
      </div>

      <!-- 整體結論 banner -->
      <div id="mConclusion" class="conclusion-banner"></div>

    </div>
  </div>
</div>

<!-- Progress bar -->
<div style="position:fixed;top:0;left:0;width:100%;z-index:200;height:2px;background:rgba(255,255,255,.05);">
  <div id="refreshBar" style="height:100%;background:linear-gradient(to right,#00ff88,#4488ff);width:100%;transition:width 1s linear;"></div>
</div>

<header style="background:rgba(5,5,15,.97);border-bottom:1px solid #1e1e3a;backdrop-filter:blur(12px);position:sticky;top:2px;z-index:100;padding:12px 24px;">
  <div style="max-width:1700px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:24px;font-weight:800;letter-spacing:-.5px;">
        <span style="color:#00ff88;">台</span><span style="color:#e8e8ff;">股雷達</span>
      </span>
      <span id="modeBadge" style="font-size:11px;color:#8888aa;background:#0d0d1f;border:1px solid #1e1e3a;padding:2px 10px;border-radius:4px;white-space:nowrap;">妖股偵測 · 初始化中</span>
      <a href="index.html" style="font-size:11px;color:#4488ff;border:1px solid rgba(68,136,255,.3);padding:2px 10px;border-radius:4px;text-decoration:none;white-space:nowrap;" onmouseover="this.style.borderColor='rgba(68,136,255,.7)'" onmouseout="this.style.borderColor='rgba(68,136,255,.3)'">⚡ 妖幣雷達</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div id="indexChips" style="display:flex;gap:6px;"></div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8888aa;">
        <span class="pulse" id="statusDot" style="width:6px;height:6px;border-radius:50%;background:#00ff88;display:inline-block;"></span>
        <span id="statusText">載入中...</span>
      </div>
      <span style="font-size:11px;color:#8888aa;" id="dataTimeEl"></span>
      <button onclick="openDailyFocus()" style="padding:4px 12px;border-radius:6px;background:rgba(247,201,72,.1);border:1px solid rgba(247,201,72,.3);color:#f7c948;font-size:12px;cursor:pointer;">📰 每日焦點</button>
      <button onclick="openSectorMap()" style="padding:4px 12px;border-radius:6px;background:rgba(68,136,255,.1);border:1px solid rgba(68,136,255,.3);color:#4488ff;font-size:12px;cursor:pointer;">🗺️ 板塊地圖</button>
      <button onclick="refresh()" style="padding:4px 12px;border-radius:6px;background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.3);color:#00ff88;font-size:12px;cursor:pointer;">↻ 刷新</button>
    </div>
  </div>
</header>

<main style="max-width:1700px;margin:0 auto;padding:20px 24px;">

  <div id="criteriaCards" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;"></div>

  <div style="display:grid;grid-template-columns:1fr 290px;gap:20px;">

    <!-- Left table -->
    <div>
      <div style="margin-bottom:10px;">
        <div style="margin-bottom:8px;">
          <input id="searchInput" type="text" placeholder="搜尋股票名稱或代號..."
            oninput="searchText=this.value.trim();renderTable()"
            style="width:100%;padding:7px 12px;border-radius:8px;background:#0d0d1f;border:1px solid #1e1e3a;color:#e8e8ff;font-size:13px;outline:none;"
            onfocus="this.style.borderColor='rgba(0,255,136,.4)'" onblur="this.style.borderColor='#1e1e3a'">
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <div id="catFilters" style="display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;flex:1;scrollbar-width:none;">
            <button class="cat-pill active" onclick="setCategory('all',this)">全部</button>
            <button class="cat-pill" onclick="setCategory('twse',this)">上市</button>
            <button class="cat-pill" onclick="setCategory('tpex',this)">上櫃</button>
            <button class="cat-pill" onclick="setCategory('semicon',this)">半導體</button>
            <button class="cat-pill" onclick="setCategory('memory',this)">記憶體</button>
            <button class="cat-pill" onclick="setCategory('icdesign',this)">IC設計</button>
            <button class="cat-pill" onclick="setCategory('aichain',this)">AI產業鏈</button>
            <button class="cat-pill" onclick="setCategory('panel',this)">面板/光電</button>
            <button class="cat-pill" onclick="setCategory('finance',this)">金融</button>
            <button class="cat-pill" onclick="setCategory('biotech',this)">生技</button>
            <button class="cat-pill" onclick="setCategory('shipping',this)">航運</button>
            <button class="cat-pill" onclick="setCategory('steel',this)">鋼鐵</button>
            <button class="cat-pill" onclick="setCategory('petrochem',this)">石化</button>
            <button class="cat-pill" onclick="setCategory('traditional',this)">傳產</button>
          </div>
          <div style="margin-left:12px;font-size:11px;color:#8888aa;white-space:nowrap;flex-shrink:0;">
            點擊查看分析 · <span id="countdown">300</span>s 刷新
          </div>
        </div>
      </div>

      <div class="info-card" style="padding:0;overflow:hidden;">
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;min-width:700px;">
            <thead>
              <tr style="background:rgba(0,0,0,.4);">
                <th onclick="sortBy('score')" style="width:58px;text-align:center;">評分 <span class="sort-arr active" id="sa-score">↓</span></th>
                <th>股票</th>
                <th onclick="sortBy('close')" style="text-align:right;">收盤 <span class="sort-arr" id="sa-close">↕</span></th>
                <th onclick="sortBy('changePct')" style="text-align:right;">漲跌% <span class="sort-arr" id="sa-changePct">↕</span></th>
                <th onclick="sortBy('rsTsmc')" style="text-align:right;">贏台積 <span class="sort-arr" id="sa-rsTsmc">↕</span></th>
                <th onclick="sortBy('valueYi')" style="text-align:right;">成交額/量比 <span class="sort-arr" id="sa-valueYi">↕</span></th>
                <th onclick="sortBy('amplitude')" style="text-align:right;">振幅 <span class="sort-arr" id="sa-amplitude">↕</span></th>
                <th style="min-width:150px;">信號</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="8" style="text-align:center;padding:40px;color:#8888aa;font-size:13px;">⏳ 載入中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <p style="font-size:11px;color:#4a4a6a;margin-top:8px;text-align:right;">資料：TWSE OpenAPI · TPEx OpenAPI · 不構成投資建議</p>
    </div>

    <!-- Right sidebar -->
    <div style="display:flex;flex-direction:column;gap:16px;">

      <div class="info-card">
        <div style="margin-bottom:12px;">
          <h3 style="font-size:13px;font-weight:700;">🏛️ 大盤概覽</h3>
          <p style="font-size:11px;color:#8888aa;margin-top:2px;" id="breadthSubtitle">今日市場強弱</p>
        </div>
        <div id="breadthPanel"><div style="text-align:center;padding:20px;color:#8888aa;font-size:12px;">⏳ 載入中...</div></div>
      </div>

      <div class="info-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <h3 style="font-size:13px;font-weight:700;">🔴 漲停榜</h3>
          <span style="font-size:10px;background:rgba(255,68,102,.15);color:#ff4466;border:1px solid rgba(255,68,102,.3);padding:1px 6px;border-radius:4px;">漲幅≥9.5%</span>
        </div>
        <div id="limitUpList"><div style="text-align:center;padding:20px;color:#8888aa;font-size:12px;">⏳ 載入中...</div></div>
      </div>

      <div class="info-card" id="consecCard">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <h3 style="font-size:13px;font-weight:700;">🔥 連板強勢榜</h3>
          <span id="consecBadge" style="font-size:10px;background:rgba(247,201,72,.15);color:#f7c948;border:1px solid rgba(247,201,72,.3);padding:1px 6px;border-radius:4px;">2連板+</span>
        </div>
        <div id="consecList"><div style="text-align:center;padding:20px;color:#8888aa;font-size:12px;">⏳ 等待昨日資料...</div></div>
      </div>

        <div id="formulaPanel" style="font-size:11px;color:#8888aa;line-height:2.2;"></div>
      </div>

    </div>
  </div>
</main>

<script>
// ── Constants ─────────────────────────────────────────────────
// serve.py exposes /proxy — same-origin, no rate limit. Skipped on static hosts (GitHub Pages).
const HAS_LOCAL_PROXY = location.protocol.startsWith('http') && !location.hostname.endsWith('github.io');
const PROXIES = [
  ...(HAS_LOCAL_PROXY ? [{ make: u => '/proxy?url=' + encodeURIComponent(u), parse: r => r.text() }] : []),
  { make: u => 'https://r.jina.ai/' + u, parse: r => r.text() },
  { make: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),  parse: r => r.text() },

  { make: u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u), parse: r => r.text() },
];
const LS_SNAP = 'tw_snap_v3';
const LS_HIST = 'tw_history_v1';

// ── Category sets ──────────────────────────────────────────────
const MEMORY_SET  = new Set(['2344','2408','4256','3576','5234','3031']);
const AI_SET      = new Set(['2317','2382','2356','3231','6669','2308','3017','3324',
  '1626','4977','2421','6409','5483','3023','6214','2312','2301','2353','2357','2324',
  '3042','6456','5315','2345','3526','6515','6547','3563','8086','6197','5471']);
const SEMICON_SET = new Set(['2330','2303','2329','2332','2337','2338','2347',
  '2351','2352','2363','2369','2376','2406','2416','2422','2423','2429','2433',
  '2434','3711','2325','6274','8046','3702','5347','2328']);
const ICDESIGN_SET= new Set(['2454','2379','2388','3034','3035','3044','3673',
  '4961','6182','6533','5274','3707','4906','3227','3704','3706','3443',
  '6415','6488','6770','3414','3546','6278','3714','6550','4919','3416']);
const PANEL_SET   = new Set(['2409','3481','2439','2448','6147','2441','4952','3008','4990','2438']);
const STEEL_SET   = new Set(['2002','2008','2010','2015','2017','2020','2022','9958']);
const PETRO_SET   = new Set(['1301','1303','1304','1305','1308','1309','1310','1314','1326','6505','1312']);
const BIOTECH_SET = new Set(['4763','4766','4741','4960','6547','6643','6452','4144','4205','1794','4720','6669']);

const SPECIFIC_CATS = ['semicon','memory','icdesign','aichain','panel','finance','biotech','shipping','steel','petrochem'];

const CAT_LABEL = {
  semicon:'半導體', memory:'記憶體', icdesign:'IC設計', aichain:'AI產業鏈',
  panel:'面板/光電', finance:'金融', biotech:'生技', shipping:'航運',
  steel:'鋼鐵', petrochem:'石化', traditional:'傳產',
};
const CAT_DESC = {
  semicon:'晶圓代工、封裝測試、半導體設備',
  memory:'DRAM、NAND Flash、記憶體模組',
  icdesign:'無廠設計（Fabless）、驅動IC、電源IC',
  aichain:'AI伺服器、散熱、連接器、PCB、CoWoS供應鏈',
  panel:'LCD/OLED面板、驅動IC、光電',
  finance:'銀行、保險、券商、金控',
  biotech:'新藥研發、醫材、CRO/CMO',
  shipping:'海運、空運、散裝、貨代',
  steel:'粗鋼、不鏽鋼、特殊鋼',
  petrochem:'石化、塑化、煉油、橡膠',
  traditional:'紡織、食品、其他傳產',
};

// ── State ──────────────────────────────────────────────────────
let allStocks   = [];
let prevMap     = {};
let hasPrev     = false;
let currentCat  = 'all';
let searchText  = '';
let sortCol     = 'score';
let sortDir     = -1;
let taiexPct    = null;
let tsmcPct     = null;
let cdVal       = 300;
let cdTotal     = 300;
let cdInterval  = null;

// ── Utilities ───────────────────────────────────────────────────
function parseNum(s) {
  if (s == null) return null;
  const str = String(s).replace(/,/g,'').trim();
  if (!str || str==='--' || str==='-' || str==='X' || str==='+') return null;
  const n = parseFloat(str.replace(/^\+/,''));
  return isNaN(n) ? null : n;
}
function fmtPrice(n) {
  if (n==null||isNaN(n)) return '--';
  return n >= 1000 ? n.toFixed(0) : n >= 100 ? n.toFixed(1) : n.toFixed(2);
}
function fmtPct(n) {
  if (n==null||isNaN(n)) return '--';
  return (n>=0?'+':'')+n.toFixed(2)+'%';
}
function fmtYi(v) {
  if (!v||v<=0) return '--';
  if (v>=100)  return v.toFixed(0)+'億';
  if (v>=10)   return v.toFixed(1)+'億';
  if (v>=1)    return v.toFixed(2)+'億';
  return (v*100).toFixed(0)+'百萬';
}
function colorPct(p) {
  if (p==null||isNaN(p)) return 'var(--text-secondary)';
  if (p>=9.5)  return '#ff2244';
  if (p>0.01)  return 'var(--accent-green)';
  if (p<-9.5)  return '#66aaff';
  if (p<-0.01) return 'var(--accent-red)';
  return 'var(--text-secondary)';
}
function getTWDate(arr) {
  return (arr.find(d=>d.Date)?.Date || '').trim();
}

// ── localStorage snapshot ───────────────────────────────────────
function loadSnap() {
  try { return JSON.parse(localStorage.getItem(LS_SNAP)); } catch(e) { return null; }
}
function saveSnap(twDate, processed) {
  try {
    localStorage.setItem(LS_SNAP, JSON.stringify({
      date: twDate,
      stocks: processed.map(s=>({ code:s.code, volume:s.volume, changePct:s.changePct }))
    }));
  } catch(e) {}
}

// ── History for weekly/monthly heatmap ───────────────────────────
function saveHistory(twDate) {
  if (!twDate || !allStocks.length) return;
  const prices = {};
  allStocks.forEach(s => { prices[s.code] = s.close; });
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem(LS_HIST)) || []; } catch(e) {}
  hist = hist.filter(h => h.d !== twDate);
  hist.push({ d: twDate, p: prices });
  if (hist.length > 60) hist = hist.slice(-60);
  try { localStorage.setItem(LS_HIST, JSON.stringify(hist)); } catch(e) {}
}
function getHistoryChanges(period) {
  if (period === 'day') return null;
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem(LS_HIST)) || []; } catch(e) {}
  if (hist.length < 2) return null;
  const daysBack = period === 'week' ? 5 : 22;
  const idx = Math.max(0, hist.length - 1 - daysBack);
  const oldP = hist[idx].p;
  const changes = {};
  allStocks.forEach(s => {
    const op = oldP[s.code];
    if (op && op > 0 && s.close > 0) changes[s.code] = (s.close - op) / op * 100;
  });
  return Object.keys(changes).length > 0 ? changes : null;
}

// ── Category ────────────────────────────────────────────────────
function getStockCat(code) {
  if (MEMORY_SET.has(code))   return 'memory';
  if (AI_SET.has(code))       return 'aichain';
  if (SEMICON_SET.has(code))  return 'semicon';
  if (ICDESIGN_SET.has(code)) return 'icdesign';
  if (PANEL_SET.has(code))    return 'panel';
  if (STEEL_SET.has(code))    return 'steel';
  if (PETRO_SET.has(code))    return 'petrochem';
  if (BIOTECH_SET.has(code))  return 'biotech';
  const n = parseInt(code);
  if (n>=2300&&n<=2399)                          return 'semicon';
  if (n>=2400&&n<=2499)                          return 'panel';
  if ((n>=3000&&n<=3699)||(n>=6000&&n<=6999))   return 'icdesign';
  if ((n>=2800&&n<=2899)||(n>=5800&&n<=5899))   return 'finance';
  if (n>=2600&&n<=2699)                          return 'shipping';
  if ((n>=1700&&n<=1799)||(n>=4700&&n<=4799))   return 'biotech';
  if (n>=2000&&n<=2099)                          return 'steel';
  if (n>=1300&&n<=1399)                          return 'petrochem';
  return 'traditional';
}
function catFilter(s) {
  if (currentCat==='all')  return true;
  if (currentCat==='twse') return s.market==='TWSE';
  if (currentCat==='tpex') return s.market==='TPEx';
  if (currentCat==='traditional') return !SPECIFIC_CATS.includes(s.cat);
  return s.cat===currentCat;
}

// ── Stock processing ────────────────────────────────────────────
function processRaw(raw, market) {
  const code = String(raw.Code||raw.SecuritiesCompanyCode||'').trim();
  const name = String(raw.Name||raw.CompanyName||'').trim();
  if (!/^[1-9]\d{3}$/.test(code)) return null;

  const close  = parseNum(raw.ClosingPrice||raw.Close);
  const change = parseNum(raw.Change||raw.change);
  const open   = parseNum(raw.OpeningPrice||raw.Open);
  const high   = parseNum(raw.HighestPrice||raw.High);
  const low    = parseNum(raw.LowestPrice||raw.Low);
  const volume = parseNum(raw.TradeVolume||raw.TradingShares)||0;
  const value  = parseNum(raw.TradeValue||raw.TransactionAmount)||0;
  const txns   = parseNum(raw.Transaction||raw.NumberOfTransactions||raw.TransactionNumber)||0;

  if (!close||close<=0||!high||!low||high<=0||low<=0||high<low) return null;

  const prevClose = change!==null ? close-change : close;
  const changePct = prevClose>0&&change!==null ? (change/prevClose)*100 : 0;
  const amplitude = prevClose>0 ? ((high-low)/prevClose)*100 : 0;
  const limitUp   = Math.round(prevClose*1.1*100)/100;
  const limitDown = Math.round(prevClose*0.9*100)/100;
  const valueYi   = value/1e8;

  const prev      = prevMap[code];
  const volRatio  = (hasPrev && prev?.volume>0 && volume>0) ? volume/prev.volume : null;
  const consecDays= (hasPrev && prev?.changePct>=9.5 && changePct>=9.5) ? 2 : (changePct>=9.5 ? 1 : 0);

  let score;
  if (hasPrev) {
    const sChange = Math.min(20, Math.max(0, changePct*2));
    const sValue  = valueYi<=0 ? 0 : Math.min(12, Math.max(0, (Math.log10(Math.max(.001,valueYi))+2)/4*12));
    const sAmp    = Math.min(12, Math.max(0, amplitude*1.2));
    let   sPrice  = 0;
    if (close>=5&&close<=50) sPrice=8;
    else if ((close>=3&&close<5)||(close>50&&close<=150)) sPrice=4;
    else if (close>150&&close<=500) sPrice=2;
    let sVol = 0;
    if (volRatio!==null) {
      if (volRatio>=5) sVol=28; else if (volRatio>=3) sVol=22;
      else if (volRatio>=2) sVol=14; else if (volRatio>=1.5) sVol=7;
    }
    let sConsec = consecDays>=2 ? 20 : consecDays===1 ? 6 : 0;
    score = Math.round(sChange+sValue+sAmp+sPrice+sVol+sConsec);
  } else {
    const sChange = Math.min(35, Math.max(0, changePct*3.5));
    const sValue  = valueYi<=0 ? 0 : Math.min(25, Math.max(0, (Math.log10(Math.max(.001,valueYi))+2)/4*25));
    const sAmp    = Math.min(25, Math.max(0, amplitude*2.5));
    let   sPrice  = 0;
    if (close>=5&&close<=50) sPrice=15;
    else if ((close>=3&&close<5)||(close>50&&close<=150)) sPrice=8;
    else if (close>150&&close<=500) sPrice=4;
    score = Math.round(sChange+sValue+sAmp+sPrice);
  }

  return {
    code, name, market, cat:getStockCat(code),
    close, change, changePct, open, high, low,
    volume, value, valueYi, txns,
    prevClose, amplitude, limitUp, limitDown,
    volRatio, consecDays, score,
  };
}

// ── Search filter ────────────────────────────────────────────────
function searchFilter(s) {
  if (!searchText) return true;
  const q = searchText.toLowerCase();
  return s.code.includes(q) || s.name.toLowerCase().includes(q);
}

// ── Signals / badges ────────────────────────────────────────────
function signals(s) {
  const out = [];
  if      (s.changePct>=9.9)  out.push(['漲停',  'background:rgba(255,34,68,.2);color:#ff2244;border:1px solid rgba(255,34,68,.5)']);
  else if (s.changePct>=8)    out.push(['近漲停', 'background:rgba(255,140,0,.15);color:#ff8c00;border:1px solid rgba(255,140,0,.4)']);
  else if (s.changePct>=5)    out.push(['強勢',   'background:rgba(0,255,136,.12);color:#00ff88;border:1px solid rgba(0,255,136,.35)']);
  if (s.amplitude>=8)          out.push(['大振幅', 'background:rgba(68,136,255,.12);color:#4488ff;border:1px solid rgba(68,136,255,.35)']);
  if (s.close>=5&&s.close<=30) out.push(['甜蜜價', 'background:rgba(170,68,255,.12);color:#aa44ff;border:1px solid rgba(170,68,255,.35)']);
  if (s.rs != null && s.rs >= 3) out.push(['跑贏大盤', 'background:rgba(0,255,136,.08);color:#00cc66;border:1px solid rgba(0,255,136,.25)']);
  if (s.rsTsmc != null && s.rsTsmc >= 3) out.push(['贏台積電', 'background:rgba(255,180,0,.1);color:#ffb400;border:1px solid rgba(255,180,0,.3)']);
  if (hasPrev) {
    if (s.consecDays>=2)
      out.push([`▲${s.consecDays}連板`, 'background:rgba(255,34,68,.3);color:#ff2244;border:1px solid rgba(255,34,68,.7);font-weight:800;']);
    if (s.volRatio!==null) {
      if      (s.volRatio>=3) out.push(['🔥爆量', 'background:rgba(247,201,72,.2);color:#f7c948;border:1px solid rgba(247,201,72,.5)']);
      else if (s.volRatio>=1.5) out.push(['量增',  'background:rgba(247,201,72,.08);color:#d4ab30;border:1px solid rgba(247,201,72,.3)']);
    }
  }
  return out;
}

function scoreStyle(sc) {
  if (sc>=75) return 'background:rgba(0,255,136,.15);border:2px solid rgba(0,255,136,.5);color:#00ff88';
  if (sc>=55) return 'background:rgba(247,201,72,.12);border:2px solid rgba(247,201,72,.4);color:#f7c948';
  if (sc>=35) return 'background:rgba(68,136,255,.12);border:2px solid rgba(68,136,255,.4);color:#4488ff';
  return 'background:rgba(136,136,170,.08);border:2px solid rgba(136,136,170,.25);color:#8888aa';
}

// ── Render: main table ──────────────────────────────────────────
function renderTable() {
  const filtered = allStocks.filter(s => catFilter(s) && searchFilter(s));
  filtered.sort((a,b) => (a[sortCol]??-Infinity)-(b[sortCol]??-Infinity));
  if (sortDir===-1) filtered.reverse();

  const tbody = document.getElementById('tableBody');
  if (!filtered.length) {
    tbody.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-secondary);font-size:13px;">${searchText ? '找不到符合的股票' : '此板塊暫無資料'}</td></tr>`;
    return;
  }
  tbody.innerHTML='';
  filtered.forEach(s => {
    const pctColor = colorPct(s.changePct);
    const sigs     = signals(s);
    const volLine  = s.volRatio!=null
      ? `<div style="font-size:10px;color:${s.volRatio>=3?'#f7c948':s.volRatio>=1.5?'#d4ab30':'var(--text-secondary)'};">${s.volRatio.toFixed(1)}x</div>`
      : '';
    const rsLine   = s.rs != null
      ? `<div style="font-size:10px;color:${s.rs>0?'#00cc66':s.rs<0?'#ff6688':'var(--text-secondary)'};margin-top:1px;">vs大盤${s.rs>0?'+':''}${s.rs.toFixed(1)}%</div>`
      : '';
    const tsmcLine = s.rsTsmc != null
      ? `<div style="font-size:12px;font-weight:600;color:${s.rsTsmc>0?'#ffb400':s.rsTsmc<0?'#ff6688':'var(--text-secondary)'};">${s.rsTsmc>0?'+':''}${s.rsTsmc.toFixed(1)}%</div>`
      : '';
    const catLbl   = CAT_LABEL[s.cat] || s.cat;

    const tr = document.createElement('tr');
    tr.className='stock-row fade-in';
    tr.onclick=()=>openModal(s);
    tr.innerHTML=`
      <td style="text-align:center;"><div class="score-circle" style="${scoreStyle(s.score)}">${s.score}</div></td>
      <td>
        <div style="font-weight:600;font-size:13px;">${s.name}</div>
        <div style="font-size:11px;color:var(--text-secondary);">${s.code} · ${s.market} · <span style="color:#4488ff;">${catLbl}</span></div>
      </td>
      <td style="text-align:right;font-weight:600;font-size:14px;">${fmtPrice(s.close)}</td>
      <td style="text-align:right;">
        <div style="font-weight:700;color:${pctColor};">${fmtPct(s.changePct)}</div>
        <div style="font-size:11px;color:${pctColor};opacity:.7;">${s.change!=null?(s.change>=0?'+':'')+fmtPrice(s.change):'--'}</div>
        ${rsLine}
      </td>
      <td style="text-align:right;">${tsmcLine || '<span style="color:var(--text-secondary);font-size:11px;">--</span>'}</td>
      <td style="text-align:right;font-size:12px;">${fmtYi(s.valueYi)}${volLine}</td>
      <td style="text-align:right;font-size:12px;">${s.amplitude.toFixed(1)}%</td>
      <td>${sigs.map(([t,st])=>`<span class="badge" style="${st}">${t}</span>`).join('')}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ── Render: breadth ─────────────────────────────────────────────
function renderBreadth() {
  if (!allStocks.length) return;
  const up    = allStocks.filter(s=>s.changePct>0.01).length;
  const down  = allStocks.filter(s=>s.changePct<-0.01).length;
  const flat  = allStocks.length-up-down;
  const limUp = allStocks.filter(s=>s.changePct>=9.5).length;
  const limDn = allStocks.filter(s=>s.changePct<=-9.5).length;
  const total = allStocks.length;
  const upW=Math.round(up/total*100), dnW=Math.round(down/total*100);

  document.getElementById('breadthSubtitle').textContent=`${total.toLocaleString()} 支股票`;
  document.getElementById('breadthPanel').innerHTML=`
    <div class="breadth-bar">
      <div style="width:${upW}%;background:var(--accent-green);"></div>
      <div style="width:${100-upW-dnW}%;background:#333355;"></div>
      <div style="width:${dnW}%;background:var(--accent-red);"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-secondary);margin-bottom:10px;">
      <span style="color:var(--accent-green);">上漲 ${upW}%</span><span>平盤</span><span style="color:var(--accent-red);">下跌 ${dnW}%</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
      <div style="background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);border-radius:8px;padding:8px;text-align:center;">
        <div style="color:var(--accent-green);font-size:22px;font-weight:700;">${up}</div>
        <div style="color:var(--text-secondary);font-size:11px;">上漲</div>
      </div>
      <div style="background:rgba(255,68,102,.08);border:1px solid rgba(255,68,102,.2);border-radius:8px;padding:8px;text-align:center;">
        <div style="color:var(--accent-red);font-size:22px;font-weight:700;">${down}</div>
        <div style="color:var(--text-secondary);font-size:11px;">下跌</div>
      </div>
      <div style="background:rgba(136,136,170,.05);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;">
        <div style="color:var(--text-secondary);font-size:22px;font-weight:700;">${flat}</div>
        <div style="color:var(--text-secondary);font-size:11px;">平盤</div>
      </div>
      <div style="background:rgba(255,34,68,.06);border:1px solid rgba(255,34,68,.2);border-radius:8px;padding:8px;text-align:center;">
        <div style="color:#ff2244;font-size:22px;font-weight:700;">${limUp}</div>
        <div style="color:var(--text-secondary);font-size:11px;">漲停</div>
      </div>
    </div>
    ${limDn>0?`<div style="margin-top:6px;background:rgba(68,136,255,.05);border:1px solid rgba(68,136,255,.15);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;"><span style="font-size:11px;color:var(--text-secondary);">跌停股</span><span style="color:#66aaff;font-weight:700;">${limDn}</span></div>`:''}
  `;
}

function renderLimitUpList() {
  const items=allStocks.filter(s=>s.changePct>=9.5).sort((a,b)=>b.changePct-a.changePct).slice(0,15);
  const el=document.getElementById('limitUpList');
  if(!items.length){el.innerHTML=`<div style="text-align:center;padding:16px;color:var(--text-secondary);font-size:12px;">今日暫無漲停股</div>`;return;}
  el.innerHTML=items.map(s=>`
    <div class="sidebar-item" onclick="openModal(allStocks.find(x=>x.code==='${s.code}'))">
      <div>
        <div style="font-weight:600;font-size:12px;">${s.name} <span style="color:var(--text-secondary);font-size:10px;">${s.code}</span>
          ${s.consecDays>=2?`<span style="background:rgba(255,34,68,.25);color:#ff2244;border:1px solid rgba(255,34,68,.5);border-radius:3px;font-size:9px;font-weight:800;padding:1px 4px;margin-left:3px;">▲${s.consecDays}連</span>`:''}
        </div>
        <div style="font-size:11px;color:var(--text-secondary);">${fmtPrice(s.close)} · ${fmtYi(s.valueYi)}${s.volRatio!=null?' · 量'+s.volRatio.toFixed(1)+'x':''}</div>
      </div>
      <div style="text-align:right;">

// ── API ──────────────────────────────────────────────────────────
async function proxiedFetch(url) {
  let lastErr;
  for (const proxy of PROXIES) {
    try {
      const r = await fetch(proxy.make(url), { cache: 'no-store', signal: AbortSignal.timeout(20000) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await proxy.parse(r);
      if (!text || typeof text !== 'string') throw new Error('empty response');
      // r.jina.ai wraps the body in a markdown preamble; JSON starts at the first bracket.
      const start = Math.min(...['[', '{'].map(ch => { const i = text.indexOf(ch); return i < 0 ? Infinity : i; }));
      if (!isFinite(start)) throw new Error('no JSON in response');
      return JSON.parse(text.slice(start));
    } catch(e) { lastErr = e; }
  }
  throw lastErr;
}

async function fetchTWSE() {
  const d = new Date();
  const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  try {
    const res = await proxiedFetch(`https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=${ymd}&type=ALLBUT0999&response=json`);
    const rows = res?.tables?.find(t => t.fields?.[0]?.includes('證券代號'))?.data;
    if (res?.stat === 'OK' && rows?.length) {

// ── Technical indicators ─────────────────────────────────────────
function calcMA(arr, period) {
  return arr.map((_, i) => {
    if (i < period - 1) return null;
    return arr.slice(i - period + 1, i + 1).reduce((a, b) => a + (b||0), 0) / period;
  });
}

function calcKD(high, low, close, period=9) {
  const n = close.length;
  const K = new Array(n).fill(null);
  const D = new Array(n).fill(null);
  let prevK = 50, prevD = 50;
  for (let i = period - 1; i < n; i++) {
    const h9 = Math.max(...high.slice(i - period + 1, i + 1).filter(v=>v!=null));
    const l9 = Math.min(...low.slice(i - period + 1, i + 1).filter(v=>v!=null));
    const rsv = h9 === l9 ? 50 : (close[i] - l9) / (h9 - l9) * 100;
    const k = prevK * 2/3 + rsv * 1/3;
    const d = prevD * 2/3 + k * 1/3;
    K[i] = k; D[i] = d;
    prevK = k; prevD = d;
  }
  return { K, D };
}

function calcMACD(close, fast=12, slow=26, signal=9) {
  const n = close.length;
  function ema(arr, period) {
    const out = new Array(n).fill(null);
    const k = 2 / (period + 1);
    let val = null;
    for (let i = 0; i < n; i++) {
      if (arr[i] == null) continue;
      val = val == null ? arr[i] : arr[i] * k + val * (1 - k);
      out[i] = val;
    }
    return out;
  }
  const ema12 = ema(close, fast);
  const ema26 = ema(close, slow);
  const dif   = ema12.map((v, i) => v != null && ema26[i] != null ? v - ema26[i] : null);
  const dea   = ema(dif, signal);
  const bar   = dif.map((v, i) => v != null && dea[i] != null ? (v - dea[i]) * 2 : null);
  return { dif, dea, bar };
}

function detectPatterns(open, high, low, close) {
  const n = close.length;
  if (n < 3) return [];
  const patterns = [];
  const last = n - 1;
  const body  = i => Math.abs(close[i] - open[i]);
  const range = i => high[i] - low[i];
  const isUp  = i => close[i] >= open[i];
  const isDoji= i => range(i) > 0 && body(i) / range(i) < 0.1;

  // 紅三軍
  if (isUp(last) && isUp(last-1) && isUp(last-2) &&
      close[last] > close[last-1] && close[last-1] > close[last-2] &&
      open[last]  > open[last-1]  && open[last-1]  > open[last-2])
    patterns.push({ name:'紅三軍', type:'bullish', desc:'三連陽，多方主導' });

  // 三隻烏鴉
  if (!isUp(last) && !isUp(last-1) && !isUp(last-2) &&
      close[last] < close[last-1] && close[last-1] < close[last-2])
    patterns.push({ name:'三隻烏鴉', type:'bearish', desc:'三連陰，空方主導' });

  // 十字線
  if (isDoji(last))
    patterns.push({ name:'十字線', type:'neutral', desc:'多空均衡，方向待確認' });

  // 晨星
  if (last >= 2) {
    const bigDown= !isUp(last-2) && range(last-2)>0 && body(last-2)/range(last-2)>0.6;
    const small  = range(last-1)>0 && body(last-1)/range(last-1)<0.3;
    const bigUp  = isUp(last) && range(last)>0 && body(last)/range(last)>0.5;
    if (bigDown && small && bigUp)
      patterns.push({ name:'晨星', type:'bullish', desc:'底部反轉，看漲信號' });
  }

  // 夜星
  if (last >= 2) {
    const bigUp  = isUp(last-2) && range(last-2)>0 && body(last-2)/range(last-2)>0.6;
    const small  = range(last-1)>0 && body(last-1)/range(last-1)<0.3;
    const bigDn  = !isUp(last) && range(last)>0 && body(last)/range(last)>0.5;
    if (bigUp && small && bigDn)
      patterns.push({ name:'夜星', type:'bearish', desc:'頂部反轉，看跌信號' });
  }

  // 錘子線
  {
    const lowerShadow = (isUp(last) ? open[last] : close[last]) - low[last];
    const upperShadow = high[last] - (isUp(last) ? close[last] : open[last]);
    if (body(last) > 0 && lowerShadow > body(last) * 2 && upperShadow < body(last) * 0.5 && !isDoji(last))
      patterns.push({ name:'錘子線', type:'bullish', desc:'下影線長，潛在支撐' });
  }

  // 吊頸線
  {
    const lowerShadow = (isUp(last) ? open[last] : close[last]) - low[last];
    const upperShadow = high[last] - (isUp(last) ? close[last] : open[last]);
    if (body(last) > 0 && upperShadow > body(last) * 2 && lowerShadow < body(last) * 0.5 && !isDoji(last))
      patterns.push({ name:'射擊之星', type:'bearish', desc:'上影線長，潛在壓力' });
  }

  return patterns;
}

function calcWinRate(close, ma5, ma20, ma60, K, D, dif, dea, bar, patterns) {
  const n = close.length;
  const last = n - 1;
  let score = 50;
  const bulls = [], bears = [];

  const c = close[last];
  if (ma5[last]  != null && c > ma5[last])  { score += 5;  bulls.push('站上MA5'); }
  if (ma20[last] != null && c > ma20[last]) { score += 8;  bulls.push('站上MA20'); }
  if (ma60[last] != null && c > ma60[last]) { score += 8;  bulls.push('站上MA60'); }
  if (ma5[last]  != null && ma20[last] != null && ma5[last]  > ma20[last]) { score += 5; bulls.push('MA5>MA20'); }
  if (ma20[last] != null && ma60[last] != null && ma20[last] > ma60[last]) { score += 5; bulls.push('MA20>MA60'); }

  const kL = K[last], dL = D[last];
  if (kL != null && dL != null) {
    if (kL > dL && kL < 80) { score += 8; bulls.push('KD金叉'); }
    if (kL < dL && kL > 20) { score -= 5; bears.push('KD死叉'); }
    if (kL < 20)            { score += 5; bulls.push('KD超賣反彈'); }
    if (kL > 80)            { score -= 6; bears.push('KD超買'); }
  }

  const difL = dif[last], deaL = dea[last], barL = bar[last];
  if (difL != null && deaL != null) {
    if (difL > deaL)          { score += 8; bulls.push('MACD金叉'); }
    else                      { score -= 5; bears.push('MACD死叉'); }
    if (difL > 0)             { score += 5; bulls.push('DIF在零軸上'); }
    if (difL < 0 && deaL < 0) { score -= 5; bears.push('雙線在零軸下'); }
    if (barL != null && barL > 0 && bar[last-1] != null && barL > bar[last-1]) { score += 3; bulls.push('紅柱擴大'); }
  }

  for (const p of patterns) {
    if (p.type === 'bullish') { score += 7; bulls.push(p.name); }
    if (p.type === 'bearish') { score -= 7; bears.push(p.name); }
  }

  if (n >= 5) {
    const recentUp = close.slice(-5).filter((v,i,a) => i>0 && v>a[i-1]).length;
    if (recentUp >= 3) { score += 4; bulls.push('近5日偏多'); }
    else if (recentUp <= 1) { score -= 4; bears.push('近5日偏空'); }
  }

  score = Math.max(5, Math.min(95, Math.round(score)));
  return { score, bulls, bears };
}

function calcRSI(close, period=14) {
  const n = close.length;
  const rsi = new Array(n).fill(null);
  if (n <= period) return rsi;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const d = close[i] - close[i-1];
    if (d > 0) gains += d; else losses += Math.abs(d);
  }
  let avgGain = gains / period, avgLoss = losses / period;
  rsi[period] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  for (let i = period + 1; i < n; i++) {
    const d = close[i] - close[i-1];
    avgGain = (avgGain * (period - 1) + (d > 0 ? d : 0)) / period;
    avgLoss = (avgLoss * (period - 1) + (d < 0 ? Math.abs(d) : 0)) / period;
    rsi[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }
  return rsi;
}

function calcBollinger(close, period=20, mult=2) {
  const n = close.length;
  const ma = calcMA(close, period);
  const upper = new Array(n).fill(null);
  const lower = new Array(n).fill(null);
  for (let i = period - 1; i < n; i++) {
    if (ma[i] == null) continue;
    const slice = close.slice(i - period + 1, i + 1);
    const std = Math.sqrt(slice.reduce((s, v) => s + Math.pow(v - ma[i], 2), 0) / period);
    upper[i] = ma[i] + mult * std;
    lower[i] = ma[i] - mult * std;
  }
  return { upper, lower };
}

// ── Draw chart (single canvas, 5 sections) ───────────────────────
function drawMainChart(canvas, timestamps, open, high, low, close, volume, ma5, ma20, ma60, bollUpper, bollLower, K, D, dif, dea, bar, rsi) {
  const PR = window.devicePixelRatio || 1;
  const W  = canvas.clientWidth;

  const SEC = { kline: 260, vol: 70, kd: 80, macd: 80, rsi: 70 };
  const TOTAL_H = SEC.kline + SEC.vol + SEC.kd + SEC.macd + SEC.rsi;
  canvas.width  = Math.round(W * PR);
  canvas.height = Math.round(TOTAL_H * PR);
  canvas.style.height = TOTAL_H + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(PR, PR);
  ctx.clearRect(0, 0, W, TOTAL_H);

  const ML = 54, MR = 6;
  const n  = close.length;
  const bw = (W - ML - MR) / n;

  // Section Y offsets
  const YOFF = {
    kline: 0,
    vol:   SEC.kline,
    kd:    SEC.kline + SEC.vol,
    macd:  SEC.kline + SEC.vol + SEC.kd,
    rsi:   SEC.kline + SEC.vol + SEC.kd + SEC.macd,
  };

  const MT = 14, MB = 6, MB_MACD = 16;

  // Helper: map value to Y within a section
  function toY(v, minV, maxV, secY, secH, mt=MT, mb=MB) {
    const ratio = maxV === minV ? 0.5 : (v - minV) / (maxV - minV);
    return secY + mt + (1 - ratio) * (secH - mt - mb);
  }

  function drawGrid(secY, secH) {
    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
      const y = secY + MT + (secH - MT - MB) * i / 4;
      ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(W - MR, y); ctx.stroke();
    }
  }

  function drawSectionBg(secY, secH) {
    ctx.fillStyle = '#05050f';
    ctx.fillRect(ML, secY, W - ML - MR, secH);
  }

  function drawLabel(text, x, y, color='#3a3a5a', size=9, align='right') {
    ctx.fillStyle = color; ctx.font = `${size}px sans-serif`; ctx.textAlign = align;
    ctx.fillText(text, x, y);
  }

  function drawPriceAxis(minP, maxP, secY, secH, steps=4) {
    for (let i = 0; i <= steps; i++) {
      const p = maxP - (maxP - minP) * i / steps;
      const y = toY(p, minP, maxP, secY, secH);
      const lbl = p >= 1000 ? p.toFixed(0) : p >= 100 ? p.toFixed(1) : p.toFixed(2);
      drawLabel(lbl, ML - 2, y + 3);
    }
  }

  // ── K-line section ─────────────────────────────────────
  const kPad = (Math.max(...high) - Math.min(...low)) * 0.05 || 1;
  const kMin = Math.min(...low)  - kPad;
  const kMax = Math.max(...high) + kPad;

  drawSectionBg(YOFF.kline, SEC.kline);
  drawGrid(YOFF.kline, SEC.kline);
  drawPriceAxis(kMin, kMax, YOFF.kline, SEC.kline);

  // Candles
  for (let i = 0; i < n; i++) {
    if (close[i] == null || open[i] == null) continue;
    const x  = ML + (i + 0.5) * bw;
    const up = close[i] >= open[i];
    const color = up ? '#ff4466' : '#44aaff';
    const yO = toY(open[i],  kMin, kMax, YOFF.kline, SEC.kline);
    const yC = toY(close[i], kMin, kMax, YOFF.kline, SEC.kline);
    const yH = toY(high[i],  kMin, kMax, YOFF.kline, SEC.kline);
    const yL = toY(low[i],   kMin, kMax, YOFF.kline, SEC.kline);

    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();

    const bodyTop = Math.min(yO, yC);
    const bodyH   = Math.max(1, Math.abs(yC - yO));
    ctx.fillStyle = color;
    ctx.fillRect(x - bw * 0.35, bodyTop, bw * 0.7, bodyH);
  }

  // Bollinger Bands overlay (drawn before MAs so MAs sit on top)
  if (bollUpper && bollLower) {
    // Filled band area
    ctx.fillStyle = 'rgba(247,201,72,.05)';
    ctx.beginPath();
    let bStarted = false;
    for (let i = 0; i < n; i++) {
      if (bollUpper[i] == null) continue;
      const x = ML + (i + 0.5) * bw;
      const y = toY(bollUpper[i], kMin, kMax, YOFF.kline, SEC.kline);
      if (!bStarted) { ctx.moveTo(x, y); bStarted = true; } else ctx.lineTo(x, y);
    }
    for (let i = n - 1; i >= 0; i--) {
      if (bollLower[i] == null) continue;
      ctx.lineTo(ML + (i + 0.5) * bw, toY(bollLower[i], kMin, kMax, YOFF.kline, SEC.kline));
    }
    ctx.closePath(); ctx.fill();
    // Upper & lower dashed lines
    ctx.strokeStyle = 'rgba(247,201,72,.45)'; ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    for (const band of [bollUpper, bollLower]) {
      ctx.beginPath(); bStarted = false;
      for (let i = 0; i < n; i++) {
        if (band[i] == null) continue;
        const x = ML + (i + 0.5) * bw;
        const y = toY(band[i], kMin, kMax, YOFF.kline, SEC.kline);
        if (!bStarted) { ctx.moveTo(x, y); bStarted = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // MA lines
  function drawLine(arr, color, lw=1) {
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      if (arr[i] == null) continue;
      const x = ML + (i + 0.5) * bw;
      const y = toY(arr[i], kMin, kMax, YOFF.kline, SEC.kline);
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  drawLine(ma5, '#f7c948');
  drawLine(ma20, '#00ff88');
  drawLine(ma60, '#aa44ff');

  // MA + Bollinger legend
  ctx.textAlign = 'left'; ctx.font = '9px sans-serif';
  [['MA5','#f7c948'],['MA20','#00ff88'],['MA60','#aa44ff'],['布林','rgba(247,201,72,.7)']].forEach(([lbl,c],i) => {
    ctx.fillStyle = c; ctx.fillText(lbl, ML + 4 + i * 38, YOFF.kline + 10);
  });
  drawLabel('K線', W - MR, YOFF.kline + 10);

  // ── Volume section ─────────────────────────────────────
  const volMax = Math.max(...volume.filter(v=>v!=null)) || 1;
  drawSectionBg(YOFF.vol, SEC.vol);

  for (let i = 0; i < n; i++) {
    if (volume[i] == null || close[i] == null) continue;
    const x  = ML + i * bw;
    const up = close[i] >= (open[i] ?? close[i]);
    const h  = volume[i] / volMax * (SEC.vol - MT - 4);
    ctx.fillStyle = up ? 'rgba(255,68,102,.55)' : 'rgba(68,170,255,.55)';
    ctx.fillRect(x + 1, YOFF.vol + SEC.vol - 4 - h, bw - 2, h);
  }
  drawLabel('VOL', W - MR, YOFF.vol + 10);

  // ── KD section ─────────────────────────────────────────
  drawSectionBg(YOFF.kd, SEC.kd);

  [20, 50, 80].forEach(v => {
    const y = toY(v, 0, 100, YOFF.kd, SEC.kd);
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(W - MR, y); ctx.stroke();
    drawLabel(v, ML - 2, y + 3);
  });

  function drawKDLine(arr, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      if (arr[i] == null) continue;
      const x = ML + (i + 0.5) * bw;
      const y = toY(Math.min(100, Math.max(0, arr[i])), 0, 100, YOFF.kd, SEC.kd);
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  drawKDLine(K, '#f7c948');
  drawKDLine(D, '#4488ff');

  drawLabel('KD(9,3,3)', W - MR, YOFF.kd + 10);
  ctx.textAlign = 'left'; ctx.font = '9px sans-serif';
  ctx.fillStyle = '#f7c948'; ctx.fillText('K', ML + 4, YOFF.kd + 10);
  ctx.fillStyle = '#4488ff'; ctx.fillText('D', ML + 16, YOFF.kd + 10);

  // ── MACD section ────────────────────────────────────────
  drawSectionBg(YOFF.macd, SEC.macd);

  const allMacdVals = [...dif, ...dea, ...bar].filter(v => v != null).map(Math.abs);
  const macdMax = Math.max(...allMacdVals) || 1;
  const midY    = YOFF.macd + MT + (SEC.macd - MT - MB_MACD) / 2;

  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ML, midY); ctx.lineTo(W - MR, midY); ctx.stroke();

  for (let i = 0; i < n; i++) {
    if (bar[i] == null) continue;
    const x  = ML + i * bw;
    const bh = bar[i] / macdMax * (SEC.macd - MT - MB_MACD) / 2;
    ctx.fillStyle = bar[i] >= 0 ? 'rgba(255,68,102,.55)' : 'rgba(68,170,255,.55)';
    if (bar[i] >= 0) ctx.fillRect(x + 1, midY - bh, bw - 2, bh);
    else             ctx.fillRect(x + 1, midY, bw - 2, -bh);
  }

  function drawMACDLine(arr, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      if (arr[i] == null) continue;
      const x  = ML + (i + 0.5) * bw;
      const bh = arr[i] / macdMax * (SEC.macd - MT - MB_MACD) / 2;
      const y  = midY - bh;
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  drawMACDLine(dif, '#f7c948');
  drawMACDLine(dea, '#00ff88');
  drawLabel('MACD(12,26,9)', W - MR, YOFF.macd + 10);

  // ── RSI section ─────────────────────────────────────────
  drawSectionBg(YOFF.rsi, SEC.rsi);

  [30, 50, 70].forEach(v => {
    const y = toY(v, 0, 100, YOFF.rsi, SEC.rsi, MT, MB_MACD);
    if (v === 70) {
      ctx.fillStyle = 'rgba(255,68,102,.06)';
      ctx.fillRect(ML, YOFF.rsi + MT, W - ML - MR, y - YOFF.rsi - MT);
    } else if (v === 30) {
      ctx.fillStyle = 'rgba(0,255,136,.06)';
      ctx.fillRect(ML, y, W - ML - MR, YOFF.rsi + SEC.rsi - MB_MACD - y);
    }
    ctx.strokeStyle = v === 50 ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.05)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(W - MR, y); ctx.stroke();
    drawLabel(v, ML - 2, y + 3);
  });

  if (rsi && rsi.some(v => v != null)) {
    ctx.strokeStyle = '#cc66ff'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    let rsiStarted = false;
    for (let i = 0; i < n; i++) {
      if (rsi[i] == null) continue;
      const x = ML + (i + 0.5) * bw;
      const y = toY(Math.min(100, Math.max(0, rsi[i])), 0, 100, YOFF.rsi, SEC.rsi, MT, MB_MACD);
      if (!rsiStarted) { ctx.moveTo(x, y); rsiStarted = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
    const rsiLast = rsi.filter(v => v != null).slice(-1)[0];
    ctx.textAlign = 'left'; ctx.font = '9px sans-serif';
    ctx.fillStyle = '#cc66ff';
    ctx.fillText(rsiLast != null ? rsiLast.toFixed(1) : '', ML + 4, YOFF.rsi + 10);
  }
  drawLabel('RSI(14)', W - MR, YOFF.rsi + 10);

  // ── Date axis: vertical grid lines + labels ──────────────────
  const step = Math.max(1, Math.floor(n / 8));
  for (let i = 0; i < n; i += step) {
    if (!timestamps[i]) continue;
    const d   = new Date(timestamps[i] * 1000);
    const xc  = ML + (i + 0.5) * bw;
    const lbl = `${d.getMonth()+1}/${d.getDate()}`;

    // Full-height vertical grid line (through all sections)
    ctx.save();
    ctx.setLineDash([2, 4]);
    ctx.strokeStyle = 'rgba(255,255,255,.07)';
    ctx.lineWidth   = 1;
    ctx.beginPath(); ctx.moveTo(xc, 0); ctx.lineTo(xc, TOTAL_H); ctx.stroke();
    ctx.restore();

    // Label strip between K-line and Volume sections
    ctx.fillStyle   = '#5566aa';
    ctx.font        = '9px sans-serif';
    ctx.textAlign   = 'center';
    ctx.fillText(lbl, xc, YOFF.vol - 3);

    // Tiny tick mark on the K-line bottom edge
    ctx.strokeStyle = '#3a3a5a';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.moveTo(xc, YOFF.vol - 12);
    ctx.lineTo(xc, YOFF.vol - 4);
    ctx.stroke();
  }
}

// ── Gauge drawing ─────────────────────────────────────────────────
function drawGauge(canvas, pct, color) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth || 120;
  const H = 68;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const cx = W / 2, cy = H * 0.88;
  const r  = Math.min(W * 0.42, cy - 4);
  // Background
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 10; ctx.lineCap = 'butt'; ctx.stroke();
  // Zones
  [{f:0,t:40,c:'rgba(255,68,102,.35)'},{f:40,t:65,c:'rgba(247,201,72,.35)'},{f:65,t:100,c:'rgba(0,255,136,.35)'}]
    .forEach(z => {
      ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI+(z.f/100)*Math.PI, Math.PI+(z.t/100)*Math.PI);
      ctx.strokeStyle = z.c; ctx.lineWidth = 10; ctx.stroke();
    });
  // Active arc
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, Math.PI+(pct/100)*Math.PI);
  ctx.strokeStyle = color; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.stroke();
  // Tick marks
  ctx.lineCap = 'butt';
  [0,25,50,75,100].forEach(p => {
    const a = Math.PI + (p/100)*Math.PI;
    const x1 = cx+(r-14)*Math.cos(a), y1 = cy+(r-14)*Math.sin(a);
    const x2 = cx+(r-7)*Math.cos(a),  y2 = cy+(r-7)*Math.sin(a);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1.5; ctx.stroke();
  });
  // Needle
  const angle = Math.PI + (pct/100)*Math.PI;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
  ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(-(r-18),0);
  ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.8; ctx.lineCap='round'; ctx.stroke();
  ctx.restore();
  // Center
  ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.fillStyle='#e8e8ff'; ctx.fill();
}

// ── Modal ────────────────────────────────────────────────────────
function closeModal() {
  document.getElementById('stockModal').style.display = 'none';
  document.body.style.overflow = '';
}

async function openModal(s) {
  if (!s) return;
  document.body.style.overflow = 'hidden';
  const modal = document.getElementById('stockModal');
  modal.style.display = 'block';

  // ── Header ─────────────────────────────────────────────────────
  document.getElementById('mName').textContent = s.name;
  document.getElementById('mCode').textContent = `(${s.code})`;
  document.getElementById('mCat').textContent  = CAT_LABEL[s.cat] || s.cat;

  const pc = colorPct(s.changePct);
  const volTxt = s.volume >= 1e4 ? (s.volume/1e4).toFixed(1)+'萬張' : s.volume+'張';
  const chgSign = s.change != null ? (s.change >= 0 ? '▲' : '▼') : '';
  const chgAbs  = s.change != null ? fmtPrice(Math.abs(s.change)) : '';
  document.getElementById('mPriceArea').innerHTML = `
    <div class="dash-hdr-val">
      <div class="v-main" style="color:${pc};">${fmtPrice(s.close)}</div>
      <div class="v-sub"  style="color:${pc};">${chgSign}${chgAbs} (${fmtPct(s.changePct)})</div>
    </div>
    <div class="dash-hdr-sep"></div>
    <div class="dash-info-block">
      <div>成交量 <span>${volTxt}</span></div>
      <div>振幅 <span>${s.amplitude.toFixed(2)}%</span></div>
    </div>
    <div class="dash-hdr-sep"></div>
    <div class="dash-info-block">
      <div>漲停 <span style="color:#ff4466;">${fmtPrice(s.limitUp)}</span></div>
      <div>市場 <span>${s.market}</span></div>
    </div>
    ${s.rs!=null?`<div class="dash-hdr-sep"></div>
    <div class="dash-info-block">
      <div>vs大盤 <span style="color:${s.rs>=0?'#00ff88':'#ff4466'};">${s.rs>0?'+':''}${s.rs.toFixed(2)}%</span></div>
      <div>妖股評分 <span style="color:#f7c948;">${s.score.toFixed(1)}</span></div>
    </div>`:''}
    ${s.rsTsmc!=null?`<div class="dash-hdr-sep"></div>
    <div class="dash-info-block">
      <div>vs台積電 <span style="color:${s.rsTsmc>=0?'#ffb400':'#ff4466'};">${s.rsTsmc>0?'+':''}${s.rsTsmc.toFixed(2)}%</span></div>
      <div>台積電 <span style="color:${tsmcPct>=0?'#ff4466':'#4488ff'};">${tsmcPct>0?'+':''}${tsmcPct.toFixed(2)}%</span></div>
    </div>`:''}`;

  document.getElementById('mLoading').style.display = 'block';
  document.getElementById('mContent').style.display = 'none';
  document.getElementById('mError').style.display   = 'none';

  try {
    const raw  = await fetchYahoo(s.code, s.market);
    const res  = raw?.chart?.result?.[0];
    if (!res) throw new Error('無K線資料');

    const ts     = res.timestamp || [];
    const q      = res.indicators?.quote?.[0] || {};
    const opens  = q.open   || [];
    const highs  = q.high   || [];
    const lows   = q.low    || [];
    const closes = q.close  || [];
    const vols   = q.volume || [];

    const valid = ts.map((_,i) => closes[i]!=null && highs[i]!=null && lows[i]!=null);
    const T  = ts.filter((_,i)     => valid[i]);
    const O  = opens.filter((_,i)  => valid[i]);
    const H  = highs.filter((_,i)  => valid[i]);
    const L  = lows.filter((_,i)   => valid[i]);
    const C  = closes.filter((_,i) => valid[i]);
    const V  = vols.filter((_,i)   => valid[i]).map(v => v||0);
    if (!C.length) throw new Error('歷史資料為空');

    const ma5  = calcMA(C,5);
    const ma20 = calcMA(C,20);
    const ma60 = calcMA(C,60);
    const { upper: bollUpper, lower: bollLower } = calcBollinger(C);
    const rsiArr = calcRSI(C);
    const { K, D } = calcKD(H,L,C);
    const { dif, dea, bar } = calcMACD(C);
    const patterns = detectPatterns(O,H,L,C);
    const { score: wr, bulls: wrBulls, bears: wrBears } = calcWinRate(C,ma5,ma20,ma60,K,D,dif,dea,bar,patterns);

    const last   = C.length - 1;
    const c      = C[last];
    const kLast  = K[last],  dLast  = D[last];
    const difL   = dif[last], deaL  = dea[last];
    const rsiLast = rsiArr.filter(v=>v!=null).slice(-1)[0] ?? null;
    const trend   = [ma5[last],ma20[last],ma60[last]].filter(m=>m&&c>m).length;

    // 突破偵測
    const breakouts = [];
    if (C.length>20 && c>Math.max(...C.slice(-21,-1))) breakouts.push('突破20日新高');
    if (C.length>60 && c>Math.max(...C.slice(-61,-1))) breakouts.push('突破60日新高');

    // Show content
    document.getElementById('mLoading').style.display = 'none';
    document.getElementById('mContent').style.display = 'block';

    // Draw K-line chart
    requestAnimationFrame(() => {
      drawMainChart(document.getElementById('mainChart'), T,O,H,L,C,V, ma5,ma20,ma60,bollUpper,bollLower,K,D,dif,dea,bar,rsiArr);
    });

    // ── 主力燈號 ──────────────────────────────────────────────────
    const vol5Avg  = V.slice(-5).reduce((a,b)=>a+b,0)/5||1;
    const vol20Avg = V.slice(-20).reduce((a,b)=>a+b,0)/20||1;
    const bullSigs = [], bearSigs = [];
    if (trend>=2) bullSigs.push('均線多頭');         else if (trend===0) bearSigs.push('均線空頭');
    if (kLast&&dLast&&kLast>dLast&&kLast<80) bullSigs.push('KD金叉');
    else if (kLast&&dLast&&kLast<dLast)       bearSigs.push('KD死叉');
    if (difL&&deaL&&difL>0&&difL>deaL) bullSigs.push('MACD多方');
    else if (difL&&deaL&&difL<deaL)    bearSigs.push('MACD空方');
    if (rsiLast&&rsiLast>=40&&rsiLast<=70) bullSigs.push('RSI健康');
    else if (rsiLast&&rsiLast>80)          bearSigs.push('RSI超買');
    else if (rsiLast&&rsiLast<30)          bullSigs.push('RSI超賣');
    if (V[last]>vol5Avg*1.3&&s.changePct>0) bullSigs.push('放量上漲');

    const sig = bullSigs.length - bearSigs.length;
    const [sColor,sLabel,sDesc] = sig>=3 ? ['#00ff88','安全','主力偏多，籌碼穩定'] :
                                   sig>=1 ? ['#f7c948','觀察','多空混合，謹慎操作'] :
                                            ['#ff4466','危險','空方為主，建議觀望'];
    document.getElementById('mSignalPanel').innerHTML = `
      <div class="panel-title">主力燈號</div>
      <div class="signal-light" style="background:${sColor};border-color:${sColor};box-shadow:0 0 18px ${sColor}70;"></div>
      <div style="font-size:18px;font-weight:900;color:${sColor};margin-bottom:4px;">${sLabel}</div>
      <div style="font-size:10px;color:#8899bb;line-height:1.5;">${sDesc}</div>
      ${bullSigs.length?`<div style="margin-top:6px;font-size:9px;color:${sColor}90;line-height:1.8;">${bullSigs.join(' · ')}</div>`:''}
      ${bearSigs.length?`<div style="font-size:9px;color:#ff446690;line-height:1.8;">${bearSigs.join(' · ')}</div>`:''}`;

    // ── 短線勝率 gauge ─────────────────────────────────────────────
    const wrColor = wr>=65?'#00ff88':wr>=50?'#f7c948':'#ff4466';
    const wrLabel = wr>=65?'勝率偏多':wr>=50?'勝率中性':'勝率偏弱';
    document.getElementById('mWinRate').innerHTML = `
      <div class="panel-title">短線勝率</div>
      <canvas id="gaugeCanvas" style="width:100%;max-width:150px;display:block;margin:0 auto;"></canvas>
      <div style="font-size:26px;font-weight:900;color:${wrColor};margin:-4px 0 2px;line-height:1;">${wr}%</div>

// ── Main load ────────────────────────────────────────────────────
async function loadAll() {
  setStatus('載入中...');
  const snap = loadSnap();
  const [twseRes, tpexRes, idxRes] = await Promise.allSettled([fetchTWSE(), fetchTPEx(), fetchIndex()]);

  const twseRaw = twseRes.status==='fulfilled' ? twseRes.value : [];
  const tpexRaw = tpexRes.status==='fulfilled' ? tpexRes.value : [];
  const idxData = idxRes.status==='fulfilled'  ? idxRes.value  : [];

  if (!twseRaw.length && !tpexRaw.length) {
    setStatus('無資料（可能為非交易日）', true);
    document.getElementById('tableBody').innerHTML=
      `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--accent-gold);font-size:13px;">⚠️ 台股資料取得失敗（可能為非交易日或服務暫停）</td></tr>`;
    ['breadthPanel','limitUpList','consecList'].forEach(id=>{
      document.getElementById(id).innerHTML=`<div style="text-align:center;padding:16px;color:var(--text-secondary);font-size:12px;">無資料</div>`;
    });
    return;
  }

  const todayDate = getTWDate(twseRaw) || getTWDate(tpexRaw);
  prevMap = {};
  hasPrev = false;
  if (snap && snap.date && snap.date !== todayDate && snap.stocks?.length) {
    snap.stocks.forEach(s => { prevMap[s.code] = s; });
    hasPrev = true;
  }

  // Extract TAIEX change % before processing so RS can be attached to each stock
  taiexPct = null;
  if (idxData.length) {
    const t = idxData.find(d => d['指數'] === '發行量加權股價指數');
    if (t) {
      const raw = parseNum(t['漲跌百分比']);
      if (raw != null) taiexPct = t['漲跌'] === '+' ? raw : -raw;
    }
  }

  const processed = [
    ...(Array.isArray(twseRaw)?twseRaw:[]).map(r=>processRaw(r,'TWSE')).filter(Boolean),
    ...(Array.isArray(tpexRaw)?tpexRaw:[]).map(r=>processRaw(r,'TPEx')).filter(Boolean),
  ];
  // 台積電是權值王，個股跑贏它比跑贏大盤更能看出資金是否輪動到中小型股
  tsmcPct = processed.find(s => s.code === '2330')?.changePct ?? null;
  processed.forEach(s => {
    s.rs     = taiexPct != null ? s.changePct - taiexPct : null;
    s.rsTsmc = tsmcPct  != null && s.code !== '2330' ? s.changePct - tsmcPct : null;
  });
  processed.sort((a,b)=>b.score-a.score);
  allStocks = processed;

  if (!snap || snap.date !== todayDate) saveSnap(todayDate, processed);
  saveHistory(todayDate);

  renderCriteriaCards();
  renderTable();
  renderBreadth();
  renderLimitUpList();
  renderConsecList();
  renderIndexChips(idxData);

  const now = new Date();
  document.getElementById('dataTimeEl').textContent =
    `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

  const parts = [];
  if (twseRes.status==='rejected') parts.push('上市');
  if (tpexRes.status==='rejected') parts.push('上櫃');
  const modeStr = hasPrev ? '量比+連板模式' : '基礎模式';
  setStatus(parts.length ? `${parts.join('+')}失敗 · ${modeStr}` : `${allStocks.length} 支 · ${modeStr}`);
}

// ── Events / helpers ─────────────────────────────────────────────
function setCategory(cat, el) {
  currentCat=cat;
  document.querySelectorAll('.cat-pill').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}
function sortBy(col) {
  sortDir = sortCol===col ? sortDir*-1 : -1;
  sortCol = col;
  document.querySelectorAll('.sort-arr').forEach(a=>{a.classList.remove('active');a.textContent='↕';});
  const el=document.getElementById('sa-'+col);
  if(el){el.classList.add('active');el.textContent=sortDir===-1?'↓':'↑';}
  renderTable();
}
function setStatus(text, error=false) {
  document.getElementById('statusText').textContent=text;
  document.getElementById('statusDot').style.background=error?'var(--accent-red)':'var(--accent-green)';
}
function getRefreshSecs() {
  const now = new Date();
  const twMins = (now.getUTCHours() * 60 + now.getUTCMinutes() + 480) % 1440;
  return (twMins >= 540 && twMins <= 810) ? 60 : 300; // 09:00-13:30 TW = 60s, else 300s
}
function updateBar(v) {
  const b=document.getElementById('refreshBar');
  if(b) b.style.width=(v/cdTotal*100)+'%';
}
function startCountdown() {
  clearInterval(cdInterval);
  cdTotal = getRefreshSecs();
  cdVal = cdTotal;
  updateBar(cdVal);
  cdInterval=setInterval(()=>{
    cdVal--;
    const el=document.getElementById('countdown');
    if(el) el.textContent=cdVal;
    updateBar(cdVal);
    if(cdVal<=0){ clearInterval(cdInterval); loadAll().then(startCountdown); }
  },1000);
}
function refresh() { loadAll().then(startCountdown); }

// ── Treemap heat color ────────────────────────────────────────────
function stockHeatBg(pct) {
  if (pct >=  9.5) return '#c01030';
  if (pct >=  5)   return '#a81a35';
  if (pct >=  3)   return '#8e2238';
  if (pct >=  1.5) return '#74283a';
  if (pct >=  0.5) return '#5a2a36';
  if (pct >=  0)   return '#3a2630';
  if (pct >= -0.5) return '#2a2a3a';
  if (pct >= -1.5) return '#243050';
  if (pct >= -3)   return '#1e3868';
  if (pct >= -5)   return '#184280';
  return '#124c98';
}

function openDailyFocus() {
  if (!allStocks.length) return;
  document.body.style.overflow = 'hidden';
  document.getElementById('dailyModal').style.display = 'block';

  const now = new Date();
  const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('dailySubtitle').textContent =
    `${allStocks.length} 支 · 更新 ${dateStr}` +
    (taiexPct != null ? ` · 大盤 ${taiexPct>0?'+':''}${taiexPct.toFixed(2)}%` : '');

  const sorted = [...allStocks];
  const byChange = [...sorted].sort((a,b)=>b.changePct-a.changePct);
  const byScore  = [...sorted].sort((a,b)=>b.score-a.score);

  // Data computations
  const upCount   = sorted.filter(s=>s.changePct>0.1).length;
  const downCount = sorted.filter(s=>s.changePct<-0.1).length;
  const flatCount = sorted.length - upCount - downCount;
  const limitUps  = sorted.filter(s=>s.changePct>=9.5);

// ── Squarified treemap layout ────────────────────────────────────
function treemapLayout(items, x, y, w, h) {
  if (!items.length) return [];
  const total = items.reduce((s,i)=>s+i.value,0);
  if (total<=0) return [];
  const sorted = items.map(it=>({...it})).sort((a,b)=>b.value-a.value);
  const result = [];
  let rx=x, ry=y, rw=w, rh=h, rVal=total, idx=0;

  while (idx < sorted.length) {
    if (sorted.length - idx === 1) {
      result.push({...sorted[idx], x:rx, y:ry, w:rw, h:rh});
      break;
    }
    const vert = rh > rw;
    const shortSide = vert ? rw : rh;
    const longSide  = vert ? rh : rw;

    let row=[sorted[idx]], rowV=sorted[idx].value;
    let best=tmWorst(row,rowV,shortSide,longSide,rVal);
    for (let j=idx+1; j<sorted.length; j++) {
      const tryRow=[...row,sorted[j]], tryV=rowV+sorted[j].value;
      const tryW=tmWorst(tryRow,tryV,shortSide,longSide,rVal);
      if (tryW<=best) { row=tryRow; rowV=tryV; best=tryW; } else break;
    }

    const thick = longSide * (rowV/rVal);
    let off=0;
    for (const it of row) {
      const len = shortSide * (it.value/rowV);
      if (vert) { result.push({...it, x:rx+off, y:ry, w:len, h:thick}); }
      else      { result.push({...it, x:rx, y:ry+off, w:thick, h:len}); }
      off += len;
    }
    if (vert) { ry+=thick; rh-=thick; } else { rx+=thick; rw-=thick; }
    rVal -= rowV;
    idx += row.length;
  }
  return result;
}
function tmWorst(items, rowV, shortSide, longSide, totalV) {
  const thick = longSide*(rowV/totalV);
  if (thick<=0) return Infinity;
  let mx=0;
  for (const it of items) {
    const len = shortSide*(it.value/rowV);
    if (len<=0) continue;
    mx = Math.max(mx, Math.max(len/thick, thick/len));
  }
  return mx;
}

function computeSectorStats() {
  const allCats = [...SPECIFIC_CATS, 'traditional'];
  const map = {};
  for (const cat of allCats) map[cat] = { stocks:[], totalValue:0, limitUp:0 };
  for (const s of allStocks) {
    const cat = SPECIFIC_CATS.includes(s.cat) ? s.cat : 'traditional';
    map[cat].stocks.push(s);
    map[cat].totalValue += s.valueYi || 0;
    if (s.changePct >= 9.5) map[cat].limitUp++;
  }
  return Object.entries(map)
    .filter(([, d]) => d.stocks.length > 0)
    .map(([cat, d]) => {
      const n = d.stocks.length;
      const avgChange = d.stocks.reduce((sum, x) => sum + x.changePct, 0) / n;
      const avgRS = taiexPct != null
        ? d.stocks.reduce((sum, x) => sum + (x.rs || 0), 0) / n : null;
      const up   = d.stocks.filter(x => x.changePct >  0.1).length;
      const down = d.stocks.filter(x => x.changePct < -0.1).length;
      const top3 = [...d.stocks].sort((a,b) => b.changePct - a.changePct).slice(0,3);
      return { cat, label:CAT_LABEL[cat]||cat, count:n, up, down,
        limitUp:d.limitUp, avgChange, avgRS, totalValue:d.totalValue, top3,
        stocks: d.stocks.sort((a,b) => (b.valueYi||0) - (a.valueYi||0)) };
    })
    .sort((a,b) => b.avgChange - a.avgChange);
}
