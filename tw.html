<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股雷達 | 妖股偵測器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg-deep: #05050f;
  --bg-card: #0d0d1f;
  --bg-hover: #141428;
  --accent-green: #00ff88;
  --accent-gold: #f7c948;
  --accent-red: #ff4466;
  --accent-blue: #4488ff;
  --accent-purple: #aa44ff;
  --text-primary: #e8e8ff;
  --text-secondary: #8888aa;
  --border: #1e1e3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-deep); color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
::-webkit-scrollbar { width: 4px; height: 4px; }
#catFilters::-webkit-scrollbar { display: none; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

@keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:.3} }
@keyframes fadeIn   { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
@keyframes glow     { 0%,100%{box-shadow:0 0 4px rgba(255,34,68,.4)} 50%{box-shadow:0 0 10px rgba(255,34,68,.9)} }

.pulse   { animation: pulse 2s ease-in-out infinite; }
.fade-in { animation: fadeIn .2s ease; }
.glow    { animation: glow 1.5s ease-in-out infinite; }

.info-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:16px; }
.cat-pill {
  padding:4px 12px; border-radius:20px; font-size:12px; cursor:pointer;
  transition:all .15s; white-space:nowrap; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text-secondary);
}
.cat-pill.active { background:rgba(0,255,136,.12); color:var(--accent-green); border-color:rgba(0,255,136,.4); }
.cat-pill:not(.active):hover { color:var(--text-primary); border-color:rgba(255,255,255,.2); }
.stock-row { transition:background .15s; cursor:pointer; border-bottom:1px solid var(--border); }
.stock-row:hover { background:var(--bg-hover); }
.expand-row { background:linear-gradient(to right,rgba(0,255,136,.04),transparent); border-left:2px solid var(--accent-green); }
.badge {
  display:inline-flex; align-items:center; padding:2px 7px;
  border-radius:4px; font-size:10px; font-weight:600; white-space:nowrap; margin-right:3px;
}
.score-circle { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; }
.sidebar-item { display:flex; align-items:center; justify-content:space-between; padding:7px 8px; border-radius:8px; margin-bottom:2px; transition:background .15s; cursor:pointer; }
.sidebar-item:hover { background:var(--bg-hover); }
th { font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-secondary); padding:10px 8px; cursor:pointer; white-space:nowrap; border-bottom:1px solid var(--border); user-select:none; }
th:hover { color:var(--text-primary); }
td { padding:9px 8px; }
.sort-arr { opacity:.4; font-size:10px; }
.sort-arr.active { opacity:1; color:var(--accent-green); }
.breadth-bar { height:8px; border-radius:4px; overflow:hidden; display:flex; margin:6px 0; }
.index-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; }
</style>
</head>
<body>

<div style="position:fixed;top:0;left:0;width:100%;z-index:200;height:2px;background:rgba(255,255,255,.05);">
  <div id="refreshBar" style="height:100%;background:linear-gradient(to right,#00ff88,#4488ff);width:100%;transition:width 1s linear;"></div>
</div>

<header style="background:rgba(5,5,15,.97);border-bottom:1px solid #1e1e3a;backdrop-filter:blur(12px);position:sticky;top:2px;z-index:100;padding:12px 24px;">
  <div style="max-width:1700px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:24px;font-weight:800;letter-spacing:-.5px;">
        <span style="color:#00ff88;">台</span><span style="color:#e8e8ff;">股雷達</span>
      </span>
      <span id="modeBadge" style="font-size:11px;color:#8888aa;background:#0d0d1f;border:1px solid #1e1e3a;padding:2px 10px;border-radius:4px;white-space:nowrap;">妖股偵測 · 初始化中</span>
      <a href="index.html" style="font-size:11px;color:#4488ff;border:1px solid rgba(68,136,255,.3);padding:2px 10px;border-radius:4px;text-decoration:none;white-space:nowrap;" onmouseover="this.style.borderColor='rgba(68,136,255,.7)'" onmouseout="this.style.borderColor='rgba(68,136,255,.3)'">⚡ 妖幣雷達</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div id="indexChips" style="display:flex;gap:6px;"></div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8888aa;">
        <span class="pulse" id="statusDot" style="width:6px;height:6px;border-radius:50%;background:#00ff88;display:inline-block;"></span>
        <span id="statusText">載入中...</span>
      </div>
      <span style="font-size:11px;color:#8888aa;" id="dataTimeEl"></span>
      <button onclick="refresh()" style="padding:4px 12px;border-radius:6px;background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.3);color:#00ff88;font-size:12px;cursor:pointer;">↻ 刷新</button>
    </div>
  </div>
</header>

<main style="max-width:1700px;margin:0 auto;padding:20px 24px;">

  <!-- 評分說明 -->
  <div id="criteriaCards" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">
    <!-- filled by JS based on mode -->
  </div>

  <div style="display:grid;grid-template-columns:1fr 290px;gap:20px;">

    <!-- 左側表格 -->
    <div>
      <div style="margin-bottom:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <div id="catFilters" style="display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;flex:1;scrollbar-width:none;">
            <button class="cat-pill active" onclick="setCategory('all',this)">全部</button>
            <button class="cat-pill" onclick="setCategory('twse',this)">上市</button>
            <button class="cat-pill" onclick="setCategory('tpex',this)">上櫃</button>
            <button class="cat-pill" onclick="setCategory('electronics',this)">電子</button>
            <button class="cat-pill" onclick="setCategory('finance',this)">金融</button>
            <button class="cat-pill" onclick="setCategory('biotech',this)">生技</button>
            <button class="cat-pill" onclick="setCategory('shipping',this)">航運</button>
            <button class="cat-pill" onclick="setCategory('traditional',this)">傳產</button>
          </div>
          <div style="margin-left:12px;font-size:11px;color:#8888aa;white-space:nowrap;flex-shrink:0;">
            點擊展開 · <span id="countdown">300</span>s 刷新
          </div>
        </div>
      </div>

      <div class="info-card" style="padding:0;overflow:hidden;">
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;min-width:700px;">
            <thead>
              <tr style="background:rgba(0,0,0,.4);">
                <th onclick="sortBy('score')" style="width:58px;text-align:center;">評分 <span class="sort-arr active" id="sa-score">↓</span></th>
                <th>股票</th>
                <th onclick="sortBy('close')" style="text-align:right;">收盤 <span class="sort-arr" id="sa-close">↕</span></th>
                <th onclick="sortBy('changePct')" style="text-align:right;">漲跌% <span class="sort-arr" id="sa-changePct">↕</span></th>
                <th onclick="sortBy('valueYi')" style="text-align:right;">成交額/量比 <span class="sort-arr" id="sa-valueYi">↕</span></th>
                <th onclick="sortBy('amplitude')" style="text-align:right;">振幅 <span class="sort-arr" id="sa-amplitude">↕</span></th>
                <th style="min-width:150px;">信號</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:#8888aa;font-size:13px;">⏳ 載入中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <p style="font-size:11px;color:#4a4a6a;margin-top:8px;text-align:right;">資料：TWSE OpenAPI · TPEx OpenAPI · 不構成投資建議</p>
    </div>

    <!-- 右側邊欄 -->
    <div style="display:flex;flex-direction:column;gap:16px;">

      <div class="info-card">
        <div style="margin-bottom:12px;">
          <h3 style="font-size:13px;font-weight:700;">🏛️ 大盤概覽</h3>
          <p style="font-size:11px;color:#8888aa;margin-top:2px;" id="breadthSubtitle">今日市場強弱</p>
        </div>
        <div id="breadthPanel"><div style="text-align:center;padding:20px;color:#8888aa;font-size:12px;">⏳ 載入中...</div></div>
      </div>

      <div class="info-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <h3 style="font-size:13px;font-weight:700;">🔴 漲停榜</h3>
          <span style="font-size:10px;background:rgba(255,68,102,.15);color:#ff4466;border:1px solid rgba(255,68,102,.3);padding:1px 6px;border-radius:4px;">漲幅≥9.5%</span>
        </div>
        <div id="limitUpList"><div style="text-align:center;padding:20px;color:#8888aa;font-size:12px;">⏳ 載入中...</div></div>
      </div>

      <div class="info-card" id="consecCard">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <h3 style="font-size:13px;font-weight:700;">🔥 連板強勢榜</h3>
          <span id="consecBadge" style="font-size:10px;background:rgba(247,201,72,.15);color:#f7c948;border:1px solid rgba(247,201,72,.3);padding:1px 6px;border-radius:4px;">2連板+</span>
        </div>
        <div id="consecList"><div style="text-align:center;padding:20px;color:#8888aa;font-size:12px;">⏳ 等待昨日資料...</div></div>
      </div>

      <div class="info-card" style="background:rgba(0,255,136,.03);border-color:rgba(0,255,136,.12);">
        <h3 style="font-size:12px;font-weight:700;color:#00ff88;margin-bottom:10px;">📐 評分公式</h3>
        <div id="formulaPanel" style="font-size:11px;color:#8888aa;line-height:2.2;"></div>
      </div>

    </div>
  </div>
</main>

<script>
// ── Constants ─────────────────────────────────────────────────
const PROXY   = 'https://corsproxy.io/?';
const LS_SNAP = 'tw_snap_v3';

// ── State ──────────────────────────────────────────────────────
let allStocks   = [];
let prevMap     = {};   // code → { volume, changePct }
let hasPrev     = false;
let currentCat  = 'all';
let sortCol     = 'score';
let sortDir     = -1;
let expandedCode= null;
let cdVal       = 300;
let cdInterval  = null;

// ── Utilities ───────────────────────────────────────────────────
function parseNum(s) {
  if (s == null) return null;
  const str = String(s).replace(/,/g,'').trim();
  if (!str || str==='--' || str==='-' || str==='X' || str==='+') return null;
  const n = parseFloat(str.replace(/^\+/,''));
  return isNaN(n) ? null : n;
}
function fmtPrice(n) {
  if (n==null||isNaN(n)) return '--';
  return n >= 1000 ? n.toFixed(0) : n >= 100 ? n.toFixed(1) : n.toFixed(2);
}
function fmtPct(n) {
  if (n==null||isNaN(n)) return '--';
  return (n>=0?'+':'')+n.toFixed(2)+'%';
}
function fmtYi(v) {
  if (!v||v<=0) return '--';
  if (v>=100)  return v.toFixed(0)+'億';
  if (v>=10)   return v.toFixed(1)+'億';
  if (v>=1)    return v.toFixed(2)+'億';
  return (v*100).toFixed(0)+'百萬';
}
function colorPct(p) {
  if (p==null||isNaN(p)) return 'var(--text-secondary)';
  if (p>=9.5)  return '#ff2244';
  if (p>0.01)  return 'var(--accent-green)';
  if (p<-9.5)  return '#66aaff';
  if (p<-0.01) return 'var(--accent-red)';
  return 'var(--text-secondary)';
}
function getTWDate(arr) {
  return (arr.find(d=>d.Date)?.Date || '').trim();
}

// ── localStorage snapshot ───────────────────────────────────────
function loadSnap() {
  try { return JSON.parse(localStorage.getItem(LS_SNAP)); } catch(e) { return null; }
}
function saveSnap(twDate, processed) {
  try {
    localStorage.setItem(LS_SNAP, JSON.stringify({
      date: twDate,
      stocks: processed.map(s=>({ code:s.code, volume:s.volume, changePct:s.changePct }))
    }));
  } catch(e) {}
}

// ── Category ────────────────────────────────────────────────────
function getStockCat(code) {
  const n = parseInt(code);
  if ((n>=2300&&n<=2399)||(n>=3000&&n<=3999)||(n>=6000&&n<=6999)) return 'electronics';
  if ((n>=2800&&n<=2899)||(n>=5800&&n<=5899))                      return 'finance';
  if (n>=2600&&n<=2699)                                             return 'shipping';
  if ((n>=1700&&n<=1799)||(n>=4700&&n<=4799))                      return 'biotech';
  return 'traditional';
}
function catFilter(s) {
  if (currentCat==='all')  return true;
  if (currentCat==='twse') return s.market==='TWSE';
  if (currentCat==='tpex') return s.market==='TPEx';
  return s.cat===currentCat;
}

// ── Stock processing ────────────────────────────────────────────
function processRaw(raw, market) {
  const code = String(raw.Code||raw.SecuritiesCompanyCode||'').trim();
  const name = String(raw.Name||raw.CompanyName||'').trim();
  if (!/^[1-9]\d{3}$/.test(code)) return null;

  const close  = parseNum(raw.ClosingPrice||raw.Close);
  const change = parseNum(raw.Change||raw.change);
  const open   = parseNum(raw.OpeningPrice||raw.Open);
  const high   = parseNum(raw.HighestPrice||raw.High);
  const low    = parseNum(raw.LowestPrice||raw.Low);
  const volume = parseNum(raw.TradeVolume||raw.TradingShares)||0;
  const value  = parseNum(raw.TradeValue||raw.TransactionAmount)||0;
  const txns   = parseNum(raw.Transaction||raw.NumberOfTransactions||raw.TransactionNumber)||0;

  if (!close||close<=0||!high||!low||high<=0||low<=0||high<low) return null;

  const prevClose = change!==null ? close-change : close;
  const changePct = prevClose>0&&change!==null ? (change/prevClose)*100 : 0;
  const amplitude = prevClose>0 ? ((high-low)/prevClose)*100 : 0;
  const limitUp   = Math.round(prevClose*1.1*100)/100;
  const limitDown = Math.round(prevClose*0.9*100)/100;
  const valueYi   = value/1e8;

  // Previous day data
  const prev      = prevMap[code];
  const volRatio  = (hasPrev && prev?.volume>0 && volume>0) ? volume/prev.volume : null;
  const consecDays= (hasPrev && prev?.changePct>=9.5 && changePct>=9.5) ? 2 : (changePct>=9.5 ? 1 : 0);

  // ── Scoring ────────────────────────────────────────────────
  let score;
  if (hasPrev) {
    // Enhanced mode: 漲幅(20)+成交額(12)+振幅(12)+甜蜜價(8)+量比(28)+連板(20) = 100
    const sChange = Math.min(20, Math.max(0, changePct*2));
    const sValue  = valueYi<=0 ? 0 : Math.min(12, Math.max(0, (Math.log10(Math.max(.001,valueYi))+2)/4*12));
    const sAmp    = Math.min(12, Math.max(0, amplitude*1.2));
    let   sPrice  = 0;
    if (close>=5&&close<=50)                              sPrice=8;
    else if ((close>=3&&close<5)||(close>50&&close<=150)) sPrice=4;
    else if (close>150&&close<=500)                        sPrice=2;

    let sVol = 0;
    if (volRatio!==null) {
      if (volRatio>=5)      sVol=28;
      else if (volRatio>=3) sVol=22;
      else if (volRatio>=2) sVol=14;
      else if (volRatio>=1.5) sVol=7;
    }

    let sConsec = 0;
    if      (consecDays>=2) sConsec=20;
    else if (consecDays===1) sConsec=6;

    score = Math.round(sChange+sValue+sAmp+sPrice+sVol+sConsec);
  } else {
    // Base mode: 漲幅(35)+成交額(25)+振幅(25)+甜蜜價(15) = 100
    const sChange = Math.min(35, Math.max(0, changePct*3.5));
    const sValue  = valueYi<=0 ? 0 : Math.min(25, Math.max(0, (Math.log10(Math.max(.001,valueYi))+2)/4*25));
    const sAmp    = Math.min(25, Math.max(0, amplitude*2.5));
    let   sPrice  = 0;
    if (close>=5&&close<=50)                              sPrice=15;
    else if ((close>=3&&close<5)||(close>50&&close<=150)) sPrice=8;
    else if (close>150&&close<=500)                        sPrice=4;
    score = Math.round(sChange+sValue+sAmp+sPrice);
  }

  return {
    code, name, market, cat:getStockCat(code),
    close, change, changePct, open, high, low,
    volume, value, valueYi, txns,
    prevClose, amplitude, limitUp, limitDown,
    volRatio, consecDays, score,
  };
}

// ── Signals / badges ────────────────────────────────────────────
function signals(s) {
  const out = [];
  if      (s.changePct>=9.9)  out.push(['漲停',  'background:rgba(255,34,68,.2);color:#ff2244;border:1px solid rgba(255,34,68,.5)']);
  else if (s.changePct>=8)    out.push(['近漲停', 'background:rgba(255,140,0,.15);color:#ff8c00;border:1px solid rgba(255,140,0,.4)']);
  else if (s.changePct>=5)    out.push(['強勢',   'background:rgba(0,255,136,.12);color:#00ff88;border:1px solid rgba(0,255,136,.35)']);
  if (s.amplitude>=8)          out.push(['大振幅', 'background:rgba(68,136,255,.12);color:#4488ff;border:1px solid rgba(68,136,255,.35)']);
  if (s.close>=5&&s.close<=30) out.push(['甜蜜價', 'background:rgba(170,68,255,.12);color:#aa44ff;border:1px solid rgba(170,68,255,.35)']);
  // Prev-data badges
  if (hasPrev) {
    if (s.consecDays>=2)
      out.push([`▲${s.consecDays}連板`, 'background:rgba(255,34,68,.3);color:#ff2244;border:1px solid rgba(255,34,68,.7);font-weight:800;']);
    if (s.volRatio!==null) {
      if      (s.volRatio>=3) out.push(['🔥爆量', 'background:rgba(247,201,72,.2);color:#f7c948;border:1px solid rgba(247,201,72,.5)']);
      else if (s.volRatio>=1.5) out.push(['量增',  'background:rgba(247,201,72,.08);color:#d4ab30;border:1px solid rgba(247,201,72,.3)']);
    }
  }
  return out;
}

// ── Score style ─────────────────────────────────────────────────
function scoreStyle(sc) {
  if (sc>=75) return 'background:rgba(0,255,136,.15);border:2px solid rgba(0,255,136,.5);color:#00ff88';
  if (sc>=55) return 'background:rgba(247,201,72,.12);border:2px solid rgba(247,201,72,.4);color:#f7c948';
  if (sc>=35) return 'background:rgba(68,136,255,.12);border:2px solid rgba(68,136,255,.4);color:#4488ff';
  return 'background:rgba(136,136,170,.08);border:2px solid rgba(136,136,170,.25);color:#8888aa';
}

// ── Render: main table ──────────────────────────────────────────
function renderTable() {
  const filtered = allStocks.filter(catFilter);
  filtered.sort((a,b) => (a[sortCol]??-Infinity)-(b[sortCol]??-Infinity));
  if (sortDir===-1) filtered.reverse();

  const tbody = document.getElementById('tableBody');
  if (!filtered.length) {
    tbody.innerHTML=`<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-secondary);font-size:13px;">此板塊暫無資料</td></tr>`;
    return;
  }
  tbody.innerHTML='';
  filtered.forEach(s => {
    const pctColor = colorPct(s.changePct);
    const sigs     = signals(s);
    const volLine  = s.volRatio!=null
      ? `<div style="font-size:10px;color:${s.volRatio>=3?'#f7c948':s.volRatio>=1.5?'#d4ab30':'var(--text-secondary)'};">${s.volRatio.toFixed(1)}x</div>`
      : '';

    const tr = document.createElement('tr');
    tr.className='stock-row fade-in';
    tr.onclick=()=>toggleRow(s.code);
    tr.innerHTML=`
      <td style="text-align:center;"><div class="score-circle" style="${scoreStyle(s.score)}">${s.score}</div></td>
      <td>
        <div style="font-weight:600;font-size:13px;">${s.name}</div>
        <div style="font-size:11px;color:var(--text-secondary);">${s.code} · ${s.market}</div>
      </td>
      <td style="text-align:right;font-weight:600;font-size:14px;">${fmtPrice(s.close)}</td>
      <td style="text-align:right;">
        <div style="font-weight:700;color:${pctColor};">${fmtPct(s.changePct)}</div>
        <div style="font-size:11px;color:${pctColor};opacity:.7;">${s.change!=null?(s.change>=0?'+':'')+fmtPrice(s.change):'--'}</div>
      </td>
      <td style="text-align:right;font-size:12px;">${fmtYi(s.valueYi)}${volLine}</td>
      <td style="text-align:right;font-size:12px;">${s.amplitude.toFixed(1)}%</td>
      <td>${sigs.map(([t,st])=>`<span class="badge" style="${st}">${t}</span>`).join('')}</td>
    `;
    tbody.appendChild(tr);

    if (expandedCode===s.code) {
      const distToLimit = s.close<s.limitUp
        ? '+'+((s.limitUp-s.close)/s.close*100).toFixed(1)+'%' : '已漲停';
      const lotsStr = s.volume>0 ? Math.round(s.volume/1000).toLocaleString()+'張' : '--';

// ── Render: index chips in header ───────────────────────────────
function renderIndexChips(indexData) {
  if (!indexData || !indexData.length) return;
  const taiex = indexData.find(d => d['指數']==='發行量加權股價指數');
  if (!taiex) return;
  const up   = taiex['漲跌']==='+';
  const pct  = parseNum(taiex['漲跌百分比']);
  const pts  = parseNum(taiex['漲跌點數']);
  const idx  = parseNum(taiex['收盤指數'].replace(/,/g,''));
  const color= up ? 'var(--accent-green)' : 'var(--accent-red)';
  document.getElementById('indexChips').innerHTML=`
    <div class="index-chip" style="background:rgba(0,0,0,.3);border:1px solid var(--border);">
      <span style="color:var(--text-secondary);">加權</span>
      <span style="color:${color};font-weight:700;">${idx?idx.toLocaleString('en',{maximumFractionDigits:2}):'--'}</span>
      <span style="color:${color};">${up?'+':''}${pct!=null?pct.toFixed(2):'--'}%</span>
    </div>
  `;
}

// ── API ──────────────────────────────────────────────────────────
async function proxiedFetch(url) {
  const r = await fetch(PROXY + encodeURIComponent(url));
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function fetchTWSE()  { return proxiedFetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL'); }
async function fetchTPEx()  { return proxiedFetch('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes'); }
async function fetchIndex() { return proxiedFetch('https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX'); }

// ── Main load ────────────────────────────────────────────────────
async function loadAll() {
  setStatus('載入中...');

  // Load prev snapshot from localStorage
  const snap = loadSnap();

  // Fetch all data in parallel
  const [twseRes, tpexRes, idxRes] = await Promise.allSettled([fetchTWSE(), fetchTPEx(), fetchIndex()]);

  const twseRaw = twseRes.status==='fulfilled' ? twseRes.value : [];
  const tpexRaw = tpexRes.status==='fulfilled' ? tpexRes.value : [];
  const idxData = idxRes.status==='fulfilled'  ? idxRes.value  : [];

  if (!twseRaw.length && !tpexRaw.length) {
    setStatus('無資料（可能為非交易日）', true);
    document.getElementById('tableBody').innerHTML=
      `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--accent-gold);font-size:13px;">⚠️ 台股資料取得失敗（可能為非交易日或服務暫停）</td></tr>`;
    ['breadthPanel','limitUpList','consecList'].forEach(id=>{
      document.getElementById(id).innerHTML=`<div style="text-align:center;padding:16px;color:var(--text-secondary);font-size:12px;">無資料</div>`;
    });
    return;
  }

  // Determine today's trading date from data
  const todayDate = getTWDate(twseRaw) || getTWDate(tpexRaw);

  // Set up prevMap if we have a previous snapshot from a DIFFERENT trading day
  prevMap = {};
  hasPrev = false;
  if (snap && snap.date && snap.date !== todayDate && snap.stocks?.length) {
    snap.stocks.forEach(s => { prevMap[s.code] = s; });
    hasPrev = true;
  }

  // Process stocks
  const processed = [
    ...(Array.isArray(twseRaw)?twseRaw:[]).map(r=>processRaw(r,'TWSE')).filter(Boolean),
    ...(Array.isArray(tpexRaw)?tpexRaw:[]).map(r=>processRaw(r,'TPEx')).filter(Boolean),
  ];
  processed.sort((a,b)=>b.score-a.score);
  allStocks = processed;

  // Save today's snapshot (only if we got a new trading day's data)
  if (!snap || snap.date !== todayDate) {
    saveSnap(todayDate, processed);
  }

  // Render everything
  renderCriteriaCards();
  renderTable();
  renderBreadth();
  renderLimitUpList();
  renderConsecList();
  renderIndexChips(idxData);

  const now = new Date();
  document.getElementById('dataTimeEl').textContent =
    `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

  const parts = [];
  if (twseRes.status==='rejected') parts.push('上市');
  if (tpexRes.status==='rejected') parts.push('上櫃');
  const modeStr = hasPrev ? '量比+連板模式' : '基礎模式';
  setStatus(parts.length ? `${parts.join('+')}失敗 · ${modeStr}` : `${allStocks.length} 支 · ${modeStr}`);
}

// ── Events ───────────────────────────────────────────────────────
function setCategory(cat, el) {
  currentCat=cat;
  document.querySelectorAll('.cat-pill').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  expandedCode=null;
  renderTable();
}
function sortBy(col) {
  sortDir = sortCol===col ? sortDir*-1 : -1;
  sortCol = col;
  document.querySelectorAll('.sort-arr').forEach(a=>{a.classList.remove('active');a.textContent='↕';});
  const el=document.getElementById('sa-'+col);
  if(el){el.classList.add('active');el.textContent=sortDir===-1?'↓':'↑';}
  renderTable();
}
function toggleRow(code) { expandedCode=expandedCode===code?null:code; renderTable(); }
function setStatus(text,error=false) {
  document.getElementById('statusText').textContent=text;
  document.getElementById('statusDot').style.background=error?'var(--accent-red)':'var(--accent-green)';
}
function updateBar(v) {
  const b=document.getElementById('refreshBar');
  if(b) b.style.width=(v/300*100)+'%';
}
function startCountdown() {
  clearInterval(cdInterval); cdVal=300; updateBar(300);
  cdInterval=setInterval(()=>{
    cdVal--;
    const el=document.getElementById('countdown');
    if(el) el.textContent=cdVal;
    updateBar(cdVal);
    if(cdVal<=0){ clearInterval(cdInterval); loadAll().then(startCountdown); }
  },1000);
}
function refresh() { loadAll().then(startCountdown); }

// ── Init ─────────────────────────────────────────────────────────
loadAll().then(startCountdown);
</script>
